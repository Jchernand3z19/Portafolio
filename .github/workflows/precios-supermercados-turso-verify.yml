name: Precios Supermercados - Verificar Turso

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/precios-supermercados-turso-verify.yml

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar configuración
        shell: bash
        run: |
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"

      - name: Instalar cliente Turso
        run: python -m pip install --disable-pip-version-check turso-serverless==0.1.0

      - name: Verificar base importada
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import turso_serverless

          connection = turso_serverless.connect(
              os.environ["TURSO_DATABASE_URL"],
              auth_token=os.environ["TURSO_AUTH_TOKEN"],
          )
          try:
              cursor = connection.cursor()
              expected_tables = {
                  "supermarkets": 1,
                  "locations": 2,
                  "products": 9439,
                  "price_history": 9439,
                  "scrape_runs": 1,
              }
              observed_tables = {}
              for table in expected_tables:
                  cursor.execute(f"SELECT COUNT(*) FROM {table}")
                  observed_tables[table] = int(cursor.fetchone()[0])

              cursor.execute(
                  """
                  SELECT location_id, city_name
                  FROM locations
                  ORDER BY location_id
                  """
              )
              locations = [tuple(row) for row in cursor.fetchall()]

              cursor.execute(
                  """
                  SELECT
                      COUNT(*),
                      SUM(CASE WHEN availability = 'in_stock' THEN 1 ELSE 0 END),
                      SUM(CASE WHEN availability = 'unknown' THEN 1 ELSE 0 END),
                      SUM(CASE WHEN is_promotion = 1 THEN 1 ELSE 0 END),
                      SUM(CASE WHEN reported_regular_price_minor IS NOT NULL THEN 1 ELSE 0 END)
                  FROM price_history
                  WHERE location_id = 'la_colonia_sps'
                  """
              )
              sps = tuple(int(value or 0) for value in cursor.fetchone())

              cursor.execute(
                  "SELECT COUNT(*) FROM price_history WHERE location_id = 'la_colonia_tgu'"
              )
              tgu_price_rows = int(cursor.fetchone()[0])

              if observed_tables != expected_tables:
                  raise SystemExit(f"table_counts_mismatch:{observed_tables!r}")
              if locations != [
                  ("la_colonia_sps", "San Pedro Sula"),
                  ("la_colonia_tgu", "Tegucigalpa"),
              ]:
                  raise SystemExit(f"locations_mismatch:{locations!r}")
              if sps != (9439, 7081, 2358, 780, 780):
                  raise SystemExit(f"sps_reconciliation_mismatch:{sps!r}")
              if tgu_price_rows != 0:
                  raise SystemExit(f"unexpected_tgu_prices:{tgu_price_rows}")

              print(
                  json.dumps(
                      {
                          "result": "success",
                          "tables": observed_tables,
                          "sps": {
                              "price_rows": sps[0],
                              "in_stock": sps[1],
                              "unknown": sps[2],
                              "promotions": sps[3],
                              "regular_price_rows": sps[4],
                          },
                          "tgu_price_rows": tgu_price_rows,
                      },
                      sort_keys=True,
                  )
              )
          finally:
              connection.close()
          PY
