name: La Colonia - Descubrimiento confiable de facets

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador cerrado de la solicitud
        required: true
        type: string
      discovery_plan:
        description: Plan cerrado de descubrimiento
        required: true
        type: string
      delay_seconds:
        description: Pausa fija entre solicitudes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: la-colonia-facet-discovery
  cancel-in-progress: false

jobs:
  facet-discovery:
    # La solicitud histórica no concede autoridad; el job está cerrado.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Validar inputs cerrados
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          DISCOVERY_PLAN: ${{ inputs.discovery_plan }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          python - <<'PY'
          import os

          expected = {
              "REQUEST_ID": "la-colonia-facet-discovery-001",
              "DISCOVERY_PLAN": "catalog_categories_v1",
              "DELAY_SECONDS": "1.5",
          }
          mismatches = [key for key, value in expected.items() if os.environ.get(key) != value]
          if mismatches:
              raise SystemExit("Inputs facet_discovery no autorizados")
          PY

      - name: Ejecutar únicamente las dos consultas confiables
        id: discovery
        env:
          PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
        run: |
          set +e
          python precios-supermercados-sps/scripts/descubrir_facets_la_colonia.py \
            --request-id "${{ inputs.request_id }}" \
            --discovery-plan "${{ inputs.discovery_plan }}" \
            --delay-seconds "${{ inputs.delay_seconds }}"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ] || [ "$exit_code" -eq 2 ]; then
            exit 0
          fi
          exit "$exit_code"

      - name: Conservar resúmenes sanitizados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-facet-discovery-${{ github.run_id }}
          path: |
            facet-discovery-summary.json
            facet-discovery-summary.md
          if-no-files-found: warn
          retention-days: 1
