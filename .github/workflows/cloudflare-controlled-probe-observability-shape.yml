name: Cloudflare controlled probe - Observability shape diagnostic

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - precios-supermercados-sps/ops/cloudflare-probe-observability-diagnostic-request.json

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: cloudflare-controlled-probe-observability-shape-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect-observability-shape:
    if: >-
      ${{ github.repository == 'Jchernand3z19/Portafolio' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == 'Jchernand3z19' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.changed_files == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-probe
    env:
      PROBE_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_PROBE_PUBLIC_KEY_SPKI_B64URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_PR_NUMBER: ${{ github.event.pull_request.number }}
      PROBE_DIAGNOSTIC_COMMENT_PATH: ${{ runner.temp }}/probe-shape-comment.json

    steps:
      - name: Prepare sanitized fallback comment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "diagnostic_status": "started_without_summary",
              "contains_no_event_values": True,
              "production_authority": False,
              "catalog_accepted": False,
          }
          rendered = json.dumps(payload, sort_keys=True, indent=2)
          Path(os.environ["PROBE_DIAGNOSTIC_COMMENT_PATH"]).write_text(
              json.dumps({
                  "body": "## Sanitized Workers Observability shape diagnostic\n\n```json\n" + rendered + "\n```"
              }),
              encoding="utf-8",
          )
          PY

      - name: Checkout trusted base revision only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Locate diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          matches = list(workspace.glob("*/scripts/diagnosticar_observability_sonda_cloudflare.py"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one controlled-probe diagnostic project")
          script = matches[0]
          project = script.parents[1]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project}\n")
              env.write(f"DIAGNOSTIC_SCRIPT={script}\n")
              env.write(f"PYTHONPATH={project / 'src'}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install verified dependencies
        shell: bash
        run: python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Download signed source artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: precios-sps-cloudflare-controlled-probe
          path: .probe-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32551882793

      - name: Inspect existing telemetry shape
        env:
          PROBE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_PROBE_OBSERVABILITY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_SCRIPT"

      - name: Publish sanitized diagnostic to triggering PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
            --input "$PROBE_DIAGNOSTIC_COMMENT_PATH"
