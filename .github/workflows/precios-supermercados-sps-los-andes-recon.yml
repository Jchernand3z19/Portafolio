name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Capturar catálogo SPS completo con presupuesto acotado
        working-directory: precios-supermercados-sps
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/los-andes-capture
          mkdir -p .tmp/los-andes-capture
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          from precios_supermercados.scrapers.comisariato_los_andes import (
              LOCATION_ID,
              LOCATION_TWO_CODE,
              OFFICE_CODE,
              PAGE_SIZE,
              STORE_ID,
              SUPERMARKET_ID,
              build_catalog_request,
              reconcile_capture,
          )

          # Autorización explícita del usuario: 2026-09-04T01:13:02Z a
          # 2026-09-05T01:13:02Z. Este job es público/read-only: sin login,
          # cookies, age-gate action, carrito, checkout ni mutaciones.
          MAX_REQUESTS = 400
          MAX_RETRIES = 10
          DELAY_SECONDS = 0.7
          TIMEOUT_SECONDS = 25
          out = Path('.tmp/los-andes-capture')
          request_count = 0
          retry_count = 0
          pages = []
          started = time.monotonic()
          last_request_at = 0.0

          def now_z() -> str:
              return datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          def request_page(skip: int, filename: str) -> tuple[dict, dict]:
              nonlocal_placeholder = None
              del nonlocal_placeholder
              global request_count, last_request_at
              if request_count >= MAX_REQUESTS:
                  raise RuntimeError('request_budget_exhausted')
              elapsed = time.monotonic() - last_request_at
              if last_request_at and elapsed < DELAY_SECONDS:
                  time.sleep(DELAY_SECONDS - elapsed)
              url, body = build_catalog_request(skip, PAGE_SIZE)
              raw_request = json.dumps(body, ensure_ascii=False, separators=(',', ':')).encode()
              req = urllib.request.Request(
                  url,
                  data=raw_request,
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                      'User-Agent': 'PreciosSupermercadosSPS/1.0 public-readonly',
                  },
              )
              observed = now_z()
              request_count += 1
              last_request_at = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT_SECONDS) as response:
                      status = response.status
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'http_error:{exc.code}:skip={skip}') from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f'network_error:skip={skip}:{exc.reason}') from exc
              if status != 200:
                  raise RuntimeError(f'http_status:{status}:skip={skip}')
              path = out / filename
              path.write_bytes(raw)
              try:
                  payload = json.loads(raw)
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise RuntimeError(f'json_invalid:skip={skip}') from exc
              record = {
                  'skip': skip,
                  'take': PAGE_SIZE,
                  'status': status,
                  'retries': 0,
                  'url': url,
                  'request_body': body,
                  'response_file': filename,
                  'response_sha256': hashlib.sha256(raw).hexdigest(),
                  'response_bytes': len(raw),
                  'observed_at_utc': observed,
              }
              return payload, record

          try:
              first, first_record = request_page(0, 'page-00000.json')
              total = first.get('totalItems')
              total_pages = first.get('totalPages')
              if type(total) is not int or total <= 0:
                  raise RuntimeError('total_items_invalid')
              if type(total_pages) is not int or total_pages <= 0:
                  raise RuntimeError('total_pages_invalid')
              expected_pages = (total + PAGE_SIZE - 1) // PAGE_SIZE
              if total_pages != expected_pages:
                  raise RuntimeError('total_pages_mismatch')
              pages.append(first_record)

              for skip in range(PAGE_SIZE, total, PAGE_SIZE):
                  payload, record = request_page(skip, f'page-{skip:05d}.json')
                  if payload.get('totalItems') != total or payload.get('totalPages') != total_pages:
                      raise RuntimeError(f'catalog_total_changed:skip={skip}')
                  pages.append(record)

              final, final_record = request_page(0, 'final-recheck.json')
              final_total = final.get('totalItems')
              if final_total != total or final.get('totalPages') != total_pages:
                  raise RuntimeError('catalog_total_changed_at_final_recheck')

              ledger = {
                  'closed': True,
                  'supermarket_id': SUPERMARKET_ID,
                  'location_id': LOCATION_ID,
                  'store_id': STORE_ID,
                  'office_code': OFFICE_CODE,
                  'location_two_code': LOCATION_TWO_CODE,
                  'concurrency': 1,
                  'max_requests': MAX_REQUESTS,
                  'max_retries': MAX_RETRIES,
                  'delay_seconds': DELAY_SECONDS,
                  'request_count': request_count,
                  'retry_count': retry_count,
                  'final_total_items': final_total,
                  'final_recheck': final_record,
                  'elapsed_seconds': round(time.monotonic() - started, 3),
                  'pages': pages,
              }
              (out / 'ledger.json').write_text(
                  json.dumps(ledger, ensure_ascii=False, indent=2, sort_keys=True),
                  encoding='utf-8',
              )

              snapshot = reconcile_capture(out)
              raw_snapshot = json.dumps(
                  snapshot, ensure_ascii=False, separators=(',', ':'), sort_keys=True
              ).encode()
              (out / 'snapshot.json').write_bytes(raw_snapshot)
              evidence = {
                  'run_result': 'success',
                  'request_count': request_count,
                  'retry_count': retry_count,
                  'catalog_products_reported': snapshot['catalog_products_reported'],
                  'unique_products_extracted': snapshot['unique_products_extracted'],
                  'skus_with_price': snapshot['skus_with_price'],
                  'availability_counts': snapshot['availability_counts'],
                  'promotion_counts': snapshot['promotion_counts'],
                  'membership_sha256': snapshot['membership_sha256'],
                  'snapshot_sha256': hashlib.sha256(raw_snapshot).hexdigest(),
                  'snapshot_bytes': len(raw_snapshot),
                  'elapsed_seconds': ledger['elapsed_seconds'],
                  'errors': [],
              }
              (out / 'evidence.json').write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True),
                  encoding='utf-8',
              )
              print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          except Exception as exc:
              (out / 'validation-error.txt').write_text(
                  f'{type(exc).__name__}: {exc}\n', encoding='utf-8'
              )
              raise
          PY

      - name: Empaquetar evidencia RAW
        if: always()
        working-directory: precios-supermercados-sps
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .tmp/los-andes-capture ]; then
            tar -czf .tmp/los-andes-capture.tar.gz -C .tmp los-andes-capture
            sha256sum .tmp/los-andes-capture.tar.gz
          fi

      - name: Publicar artefacto de captura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comisariato-los-andes-sps-full-capture
          path: |
            precios-supermercados-sps/.tmp/los-andes-capture.tar.gz
            precios-supermercados-sps/.tmp/los-andes-capture/evidence.json
            precios-supermercados-sps/.tmp/los-andes-capture/validation-error.txt
          if-no-files-found: warn
          retention-days: 14
