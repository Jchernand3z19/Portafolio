name: Precios SPS - Paiz recuperación temporal

on:
  push:
    branches: [feature/paiz-final-acquisition]
    paths:
      - .github/workflows/precios-supermercados-sps-paiz-initial-temp.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: precios-sps-paiz-recovery-temp
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      SOURCE_ARTIFACT_ID: "9924053887"
      SOURCE_RUN_ID: "33837881993"
      MULTIPLAZA_SHA256: "e8c1df4b71d8554a78e0fcc66c4701b85724aafde9a12663f2fb86f1a701d2a2"
      PROCERES_SHA256: "82773b2684575ee982158f5b7a81add2397d19a4ae9d4f32b1c6346379ebe4fe"
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compilar componentes y probar migración offline
        run: |
          set -euo pipefail
          python -m py_compile scripts/migrar_mvp_paiz.py scripts/actualizar_mvp_turso_paiz.py
          python - <<'PY'
          import sqlite3
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from generar_mvp_sqlite_la_colonia import create_schema
          from migrar_mvp_paiz import locations_index_ready_sql, migrate_sqlite, schema_ready_sql

          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / 'mvp.sqlite'
              con = sqlite3.connect(db)
              create_schema(con)
              con.execute("INSERT INTO supermarkets VALUES('paiz','Paiz','HN')")
              con.execute("INSERT INTO locations VALUES('paiz_tgu_multiplaza','paiz','Tegucigalpa','HN')")
              con.commit()
              con.close()
              result = migrate_sqlite(db)
              assert result['migrated'] is True
              con = sqlite3.connect(db)
              price_sql = con.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='price_history'").fetchone()[0]
              location_index = con.execute("SELECT sql FROM sqlite_master WHERE type='index' AND name='idx_locations_city_legacy'").fetchone()[0]
              locations = con.execute("SELECT location_id FROM locations WHERE supermarket_id='paiz' ORDER BY location_id").fetchall()
              assert schema_ready_sql(price_sql)
              assert locations_index_ready_sql(location_index)
              assert locations == [('paiz_tgu_multiplaza',), ('paiz_tgu_proceres',)]
              assert con.execute('PRAGMA foreign_key_check').fetchall() == []
              assert con.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
              con.close()
          PY

      - name: Reutilizar captura aceptada del run 33837881993
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p run-artifacts/paiz-source run-artifacts/paiz-recovery
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/paiz-source.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          unzip -q /tmp/paiz-source.zip \
            snapshot-paiz-multiplaza.json snapshot-paiz-proceres.json evidence.json persist-multiplaza.json \
            -d run-artifacts/paiz-source
          echo "${MULTIPLAZA_SHA256}  run-artifacts/paiz-source/snapshot-paiz-multiplaza.json" | sha256sum -c -
          echo "${PROCERES_SHA256}  run-artifacts/paiz-source/snapshot-paiz-proceres.json" | sha256sum -c -

      - name: Validar ambos snapshots antes de producción
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes
          base = Path('run-artifacts/paiz-source')
          out = {}
          for name in ('multiplaza', 'proceres'):
              snap = validate_snapshot_bytes((base / f'snapshot-paiz-{name}.json').read_bytes())
              out[name] = {k: snap[k] for k in ('location_id','catalog_products_reported','skus_extracted','skus_with_price','availability_counts','promotion_counts')}
          Path('run-artifacts/paiz-recovery/prewrite-validation.json').write_text(
              json.dumps(out, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY

      - name: Migrar índice productivo de locations para Paiz
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/migrar_mvp_paiz.py --turso | tee run-artifacts/paiz-recovery/schema-migration.json

      - name: Persistir únicamente Paiz Próceres
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz-source/snapshot-paiz-proceres.json \
            --run-id "paiz-recovery-${GITHUB_RUN_ID}-proceres" \
            --source-artifact-id "${SOURCE_ARTIFACT_ID}" \
            --verify | tee run-artifacts/paiz-recovery/persist-proceres.json

      - name: Postflight productivo de ambos contextos
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_turso_la_colonia import _execute_rows, _pipeline, _stmt
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes
          from migrar_mvp_paiz import locations_index_ready_sql, schema_ready_sql

          base = Path('run-artifacts/paiz-source')
          snaps = {n: validate_snapshot_bytes((base / f'snapshot-paiz-{n}.json').read_bytes()) for n in ('multiplaza','proceres')}
          recovery_run = f'paiz-recovery-{os.environ["GITHUB_RUN_ID"]}-proceres'
          queries = [
              ('paiz_locations', "SELECT location_id,city_name FROM locations WHERE supermarket_id='paiz' ORDER BY location_id", ()),
              ('paiz_products', "SELECT COUNT(*) FROM products WHERE supermarket_id='paiz'", ()),
              ('paiz_open', "SELECT location_id,COUNT(*) FROM price_history WHERE supermarket_id='paiz' AND valid_to_utc IS NULL GROUP BY location_id ORDER BY location_id", ()),
              ('paiz_runs', "SELECT scrape_run_id,location_id,sku_count,catalog_product_count,run_status,source_json_sha256 FROM scrape_runs WHERE scrape_run_id IN (?,?) ORDER BY location_id", ('paiz-initial-33837881993-multiplaza', recovery_run)),
              ('duplicate_current', "SELECT COUNT(*) FROM (SELECT supermarket_id,product_id,location_id FROM price_history WHERE valid_to_utc IS NULL GROUP BY supermarket_id,product_id,location_id HAVING COUNT(*)>1)", ()),
              ('fk_violations', 'SELECT COUNT(*) FROM pragma_foreign_key_check', ()),
              ('integrity_check', 'PRAGMA integrity_check', ()),
              ('price_ddl', "SELECT sql FROM sqlite_master WHERE type='table' AND name='price_history'", ()),
              ('locations_index', "SELECT sql FROM sqlite_master WHERE type='index' AND name='idx_locations_city_legacy'", ()),
          ]
          data = _pipeline(os.environ['TURSO_DATABASE_URL'], os.environ['TURSO_AUTH_TOKEN'], [{'type':'execute','stmt':_stmt(sql,args)} for _,sql,args in queries] + [{'type':'close'}])
          out = {name: _execute_rows(result) for (name,_,_), result in zip(queries, data['results'], strict=False)}
          expected_locations = [['paiz_tgu_multiplaza','Tegucigalpa'], ['paiz_tgu_proceres','Tegucigalpa']]
          expected_open = [['paiz_tgu_multiplaza', snaps['multiplaza']['skus_extracted']], ['paiz_tgu_proceres', snaps['proceres']['skus_extracted']]]
          union = len({r['source_key'] for s in snaps.values() for r in s['products']})
          expected_runs = [
              ['paiz-initial-33837881993-multiplaza','paiz_tgu_multiplaza',snaps['multiplaza']['skus_extracted'],snaps['multiplaza']['catalog_products_reported'],'success',os.environ['MULTIPLAZA_SHA256']],
              [recovery_run,'paiz_tgu_proceres',snaps['proceres']['skus_extracted'],snaps['proceres']['catalog_products_reported'],'success',os.environ['PROCERES_SHA256']],
          ]
          if out['paiz_locations'] != expected_locations:
              raise SystemExit(f"paiz_locations_mismatch:{out['paiz_locations']}")
          if out['paiz_open'] != expected_open or out['paiz_products'] != [[union]]:
              raise SystemExit(f"paiz_state_mismatch:{out['paiz_open']}:{out['paiz_products']}:{expected_open}:{union}")
          if out['paiz_runs'] != expected_runs:
              raise SystemExit(f"paiz_runs_mismatch:{out['paiz_runs']}:{expected_runs}")
          if out['duplicate_current'] != [[0]] or out['fk_violations'] != [[0]] or out['integrity_check'] != [['ok']]:
              raise SystemExit(f"integrity_failed:{out['duplicate_current']}:{out['fk_violations']}:{out['integrity_check']}")
          if len(out['price_ddl']) != 1 or not schema_ready_sql(out['price_ddl'][0][0]):
              raise SystemExit('paiz_price_schema_not_ready')
          if len(out['locations_index']) != 1 or not locations_index_ready_sql(out['locations_index'][0][0]):
              raise SystemExit('paiz_location_index_not_ready')
          out['price_ddl'] = [['verified_paiz_nullable_out_of_stock']]
          out['locations_index'] = [['verified_multi_context_paiz']]
          Path('run-artifacts/paiz-recovery/postflight.json').write_text(
              json.dumps(out, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publicar evidencia de recuperación
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paiz-recovery-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/paiz-recovery/
          if-no-files-found: warn
          retention-days: 7
