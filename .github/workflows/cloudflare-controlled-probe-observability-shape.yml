name: Cloudflare controlled probe - Observability shape diagnostic

on:
  push:
    branches: [main]
    paths:
      - precios-supermercados-sps/ops/cloudflare-probe-observability-diagnostic-request.json

permissions:
  contents: read

concurrency:
  group: cloudflare-controlled-probe-observability-shape-main
  cancel-in-progress: false

jobs:
  verify-main-marker:
    if: >-
      ${{ github.repository == 'Jchernand3z19/Portafolio' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      marker_verified: ${{ steps.verify.outputs.marker_verified }}

    steps:
      - name: Checkout immutable main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact one-shot marker
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = Path(os.environ["GITHUB_WORKSPACE"]) / "precios-supermercados-sps" / "ops" / "cloudflare-probe-observability-diagnostic-request.json"
          payload = json.loads(marker.read_text(encoding="utf-8"))
          expected = {
              "schema": "cloudflare-controlled-probe-observability-diagnostic-request-1",
              "sourceRunId": "32551882793",
              "purpose": "sanitized-shape-observation-only",
              "requestSequence": 3,
              "authority": False,
          }
          if payload != expected:
              raise SystemExit("controlled_observability_marker_mismatch")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("marker_verified=true\n")
          PY

  publish-main-trigger-heartbeat:
    needs: verify-main-marker
    if: ${{ always() }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TARGET_PR_NUMBER: "117"
      MARKER_VERIFIED: ${{ needs.verify-main-marker.outputs.marker_verified == 'true' }}

    steps:
      - name: Prepare sanitized main-push heartbeat
        shell: bash
        run: |
          set -euo pipefail
          HEARTBEAT_PATH="$RUNNER_TEMP/observability-main-push-heartbeat.json"
          export HEARTBEAT_PATH
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "diagnostic_status": "main_push_trigger_observed",
              "marker_verified": os.environ["MARKER_VERIFIED"].lower() == "true",
              "contains_no_event_values": True,
              "production_authority": False,
              "catalog_accepted": False,
          }
          rendered = json.dumps(payload, sort_keys=True, indent=2)
          Path(os.environ["HEARTBEAT_PATH"]).write_text(
              json.dumps({
                  "body": "## Sanitized Workers Observability main-push heartbeat\n\n```json\n" + rendered + "\n```"
              }),
              encoding="utf-8",
          )
          PY

      - name: Publish sanitized main-push heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
            --input "$HEARTBEAT_PATH"

  inspect-observability-shape:
    needs: verify-main-marker
    if: ${{ needs.verify-main-marker.outputs.marker_verified == 'true' }}
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-probe
    env:
      PROBE_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_PROBE_PUBLIC_KEY_SPKI_B64URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_PR_NUMBER: "117"

    steps:
      - name: Prepare sanitized fallback comment
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DIAGNOSTIC_COMMENT_PATH="$RUNNER_TEMP/probe-shape-main-comment.json"
          export PROBE_DIAGNOSTIC_COMMENT_PATH
          printf 'PROBE_DIAGNOSTIC_COMMENT_PATH=%s\n' "$PROBE_DIAGNOSTIC_COMMENT_PATH" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "diagnostic_status": "started_without_summary",
              "contains_no_event_values": True,
              "production_authority": False,
              "catalog_accepted": False,
          }
          rendered = json.dumps(payload, sort_keys=True, indent=2)
          Path(os.environ["PROBE_DIAGNOSTIC_COMMENT_PATH"]).write_text(
              json.dumps({
                  "body": "## Sanitized Workers Observability shape diagnostic\n\n```json\n" + rendered + "\n```"
              }),
              encoding="utf-8",
          )
          PY

      - name: Checkout immutable main revision only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          matches = list(workspace.glob("*/scripts/diagnosticar_observability_sonda_cloudflare.py"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one controlled-probe diagnostic project")
          script = matches[0]
          project = script.parents[1]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project}\n")
              env.write(f"DIAGNOSTIC_SCRIPT={script}\n")
              env.write(f"PYTHONPATH={project / 'src'}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install verified dependencies
        shell: bash
        run: python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Download signed source artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: precios-sps-cloudflare-controlled-probe
          path: .probe-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32551882793

      - name: Inspect existing telemetry shape
        env:
          PROBE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_PROBE_OBSERVABILITY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_SCRIPT"

      - name: Publish sanitized diagnostic to marker PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
            --input "$PROBE_DIAGNOSTIC_COMMENT_PATH"
