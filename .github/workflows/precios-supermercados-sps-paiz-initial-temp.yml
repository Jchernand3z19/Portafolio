name: Precios SPS - Paiz carga inicial temporal

on:
  push:
    branches: [feature/paiz-final-acquisition]
    paths:
      - .github/workflows/precios-supermercados-sps-paiz-initial-temp.yml

permissions:
  contents: read

concurrency:
  group: precios-sps-paiz-initial-temp
  cancel-in-progress: false

jobs:
  initial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compilar componentes Paiz
        run: |
          set -euo pipefail
          python -m py_compile scripts/migrar_mvp_paiz.py
          python -m py_compile scripts/actualizar_mvp_turso_paiz.py
          python -m py_compile scripts/obtener_catalogo_paiz_operativo.py

      - name: Capturar ambos catálogos TGU con runner definitivo
        run: |
          set -euo pipefail
          python scripts/obtener_catalogo_paiz_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 1.0 \
            --max-requests 500 \
            --output-directory run-artifacts/paiz \
            --raw-directory run-artifacts/paiz/raw \
            --evidence-output run-artifacts/paiz/evidence.json

      - name: Validar snapshots antes de producción
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes
          output = {}
          for name in ('multiplaza', 'proceres'):
              path = Path(f'run-artifacts/paiz/snapshot-paiz-{name}.json')
              snap = validate_snapshot_bytes(path.read_bytes())
              output[name] = {
                  'location_id': snap['location_id'],
                  'catalog_products_reported': snap['catalog_products_reported'],
                  'skus_extracted': snap['skus_extracted'],
                  'skus_with_price': snap['skus_with_price'],
                  'availability_counts': snap['availability_counts'],
                  'promotion_counts': snap['promotion_counts'],
              }
          Path('run-artifacts/paiz/prewrite-validation.json').write_text(
              json.dumps(output, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8'
          )
          print(json.dumps(output, ensure_ascii=False, sort_keys=True))
          PY

      - name: Migrar esquema productivo para Paiz
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/migrar_mvp_paiz.py --turso | tee run-artifacts/paiz/schema-migration.json

      - name: Persistir Paiz Multiplaza
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz/snapshot-paiz-multiplaza.json \
            --run-id "paiz-initial-${GITHUB_RUN_ID}-multiplaza" \
            --verify | tee run-artifacts/paiz/persist-multiplaza.json

      - name: Persistir Paiz Próceres
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz/snapshot-paiz-proceres.json \
            --run-id "paiz-initial-${GITHUB_RUN_ID}-proceres" \
            --verify | tee run-artifacts/paiz/persist-proceres.json

      - name: Postflight productivo global
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_turso_la_colonia import _execute_rows, _pipeline, _stmt
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes
          from migrar_mvp_paiz import schema_ready_sql

          snaps = {}
          for name in ('multiplaza', 'proceres'):
              snaps[name] = validate_snapshot_bytes(
                  Path(f'run-artifacts/paiz/snapshot-paiz-{name}.json').read_bytes()
              )
          statements = [
              ('supermarkets', 'SELECT COUNT(*) FROM supermarkets', ()),
              ('locations', 'SELECT COUNT(*) FROM locations', ()),
              ('products', 'SELECT COUNT(*) FROM products', ()),
              ('price_history', 'SELECT COUNT(*) FROM price_history', ()),
              ('current_periods', 'SELECT COUNT(*) FROM price_history WHERE valid_to_utc IS NULL', ()),
              ('scrape_runs', 'SELECT COUNT(*) FROM scrape_runs', ()),
              ('paiz_products', "SELECT COUNT(*) FROM products WHERE supermarket_id='paiz'", ()),
              ('paiz_open', "SELECT location_id,COUNT(*) FROM price_history WHERE supermarket_id='paiz' AND valid_to_utc IS NULL GROUP BY location_id ORDER BY location_id", ()),
              ('paiz_runs', "SELECT scrape_run_id,location_id,sku_count,catalog_product_count,run_status FROM scrape_runs WHERE scrape_run_id IN (?,?) ORDER BY location_id", (f'paiz-initial-{os.environ["GITHUB_RUN_ID"]}-multiplaza', f'paiz-initial-{os.environ["GITHUB_RUN_ID"]}-proceres')),
              ('duplicate_current', "SELECT COUNT(*) FROM (SELECT supermarket_id,product_id,location_id FROM price_history WHERE valid_to_utc IS NULL GROUP BY supermarket_id,product_id,location_id HAVING COUNT(*)>1)", ()),
              ('fk_violations', 'SELECT COUNT(*) FROM pragma_foreign_key_check', ()),
              ('integrity_check', 'PRAGMA integrity_check', ()),
              ('price_history_ddl', "SELECT sql FROM sqlite_master WHERE type='table' AND name='price_history'", ()),
          ]
          requests = [
              {'type':'execute','stmt':_stmt(sql,args)} for _,sql,args in statements
          ] + [{'type':'close'}]
          data = _pipeline(os.environ['TURSO_DATABASE_URL'], os.environ['TURSO_AUTH_TOKEN'], requests)
          out = {}
          for (name,_,_), result in zip(statements, data['results'], strict=False):
              out[name] = _execute_rows(result)
          expected_open = [
              ['paiz_tgu_multiplaza', snaps['multiplaza']['skus_extracted']],
              ['paiz_tgu_proceres', snaps['proceres']['skus_extracted']],
          ]
          if out['paiz_open'] != expected_open:
              raise SystemExit(f"paiz_open_mismatch:{out['paiz_open']}:{expected_open}")
          if out['paiz_products'] != [[len(set(r['source_key'] for s in snaps.values() for r in s['products']))]]:
              raise SystemExit(f"paiz_products_mismatch:{out['paiz_products']}")
          if len(out['paiz_runs']) != 2 or any(row[4] != 'success' for row in out['paiz_runs']):
              raise SystemExit(f"paiz_runs_invalid:{out['paiz_runs']}")
          if out['duplicate_current'] != [[0]] or out['fk_violations'] != [[0]] or out['integrity_check'] != [['ok']]:
              raise SystemExit(f"integrity_failed:{out['duplicate_current']}:{out['fk_violations']}:{out['integrity_check']}")
          if len(out['price_history_ddl']) != 1 or not schema_ready_sql(out['price_history_ddl'][0][0]):
              raise SystemExit('paiz_schema_not_ready')
          out['price_history_ddl'] = [['verified_paiz_nullable_out_of_stock']]
          Path('run-artifacts/paiz/postflight.json').write_text(
              json.dumps(out, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paiz-initial-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/paiz/
          if-no-files-found: warn
          retention-days: 7
