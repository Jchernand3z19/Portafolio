name: Pagos WhatsApp Residencial CI

on:
  pull_request:
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'

permissions:
  contents: read

concurrency:
  group: pagos-whatsapp-residencial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pagos-whatsapp-residencial
    env:
      APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Emit lockfile snapshot for one-time repository bootstrap
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const encoded = Buffer.from(fs.readFileSync('package-lock.json')).toString('base64');
          const size = 3000;
          for (let i = 0; i < encoded.length; i += size) {
            const index = String(i / size).padStart(4, '0');
            console.log(`PAGOS_LOCK_${index}:${encoded.slice(i, i + size)}`);
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
