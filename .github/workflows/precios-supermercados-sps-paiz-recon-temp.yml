name: Precios SPS - Paiz finalización temporal

on:
  push:
    branches: [feature/paiz-final-acquisition]
    paths:
      - precios-supermercados-sps/src/precios_supermercados/scrapers/paiz.py
      - precios-supermercados-sps/scripts/generar_snapshots_paiz.py
      - .github/workflows/precios-supermercados-sps-paiz-recon-temp.yml

permissions:
  contents: write

concurrency:
  group: precios-sps-paiz-finalize-temp
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Generar snapshots sólo desde RAW aceptado
        run: python scripts/generar_snapshots_paiz.py reports/paiz/2026-09-04-full

      - name: Verificar evidencia reproducible
        run: |
          set -euo pipefail
          python scripts/generar_snapshots_paiz.py reports/paiz/2026-09-04-full > /tmp/replay.json
          git diff --check

      - name: Publicar normalización durable
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/paiz/2026-09-04-full
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "docs(paiz): publish normalized TGU snapshots"
          git push origin HEAD:feature/paiz-final-acquisition
