name: Precios SPS - backfill inicial homologación temporal

on:
  push:
    branches:
      - ops/product-homologation-initial-backfill
    paths:
      - ".github/workflows/precios-supermercados-sps-homologation-initial-backfill-temp.yml"

permissions:
  contents: read

jobs:
  backfill:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cargar perfiles y verificar invariantes productivos
        working-directory: precios-supermercados-sps
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from backfill_homologacion_turso import (
              _query,
              _scalar,
              _source_preflight,
              persist_homologation,
          )
          from precios_supermercados.product_homologation_persistence import TABLE_NAME

          url = os.environ['TURSO_DATABASE_URL']
          token = os.environ['TURSO_AUTH_TOKEN']
          expected_before = {
              'products': 56779,
              'price_history': 110002,
              'scrape_runs': 21,
              'profiles': 0,
          }
          before = _source_preflight(url, token)
          if before != expected_before:
              raise SystemExit(f'production_preflight_changed:{before}')

          result = persist_homologation(
              database_url=url,
              auth_token=token,
              updated_at_utc='2026-09-05T04:42:32Z',
          )
          after = _source_preflight(url, token)

          expected_after = {
              'products': before['products'],
              'price_history': before['price_history'],
              'scrape_runs': before['scrape_runs'],
              'profiles': before['products'],
          }
          if after != expected_after:
              raise SystemExit(f'production_postflight_changed:{after}')

          stage_count = _scalar(
              url,
              token,
              "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_homologation_profiles_stage'",
          )
          if stage_count != 0:
              raise SystemExit('staging_table_left_behind')

          status_rows = _query(
              url,
              token,
              f"SELECT comparison_status,COUNT(*) FROM {TABLE_NAME} GROUP BY comparison_status ORDER BY comparison_status",
          )
          statuses = {str(row[0]): int(row[1]) for row in status_rows}
          expected_statuses = {
              'ready': 18773,
              'review_required': 2558,
              'single_source': 13034,
              'unmapped': 22414,
          }
          if statuses != expected_statuses:
              raise SystemExit(f'comparison_status_mismatch:{statuses}')

          metrics = {
              'valid_gtin': _scalar(url, token, f"SELECT COUNT(*) FROM {TABLE_NAME} WHERE canonical_gtin IS NOT NULL"),
              'classified_product_type': _scalar(url, token, f"SELECT COUNT(*) FROM {TABLE_NAME} WHERE product_type IS NOT NULL"),
              'ready_canonical_groups': _scalar(url, token, f"SELECT COUNT(DISTINCT canonical_product_id) FROM {TABLE_NAME} WHERE comparison_status='ready'"),
              'review_canonical_groups': _scalar(url, token, f"SELECT COUNT(DISTINCT canonical_product_id) FROM {TABLE_NAME} WHERE comparison_status='review_required'"),
              'foreign_key_violations': _scalar(url, token, "SELECT COUNT(*) FROM pragma_foreign_key_check"),
              'duplicate_open_periods': _scalar(url, token, "SELECT COUNT(*) FROM (SELECT product_id,location_id FROM price_history WHERE valid_to_utc IS NULL GROUP BY product_id,location_id HAVING COUNT(*)>1)"),
          }
          integrity = _query(url, token, 'PRAGMA integrity_check')
          expected_metrics = {
              'valid_gtin': 34365,
              'classified_product_type': 18748,
              'ready_canonical_groups': 8126,
              'review_canonical_groups': 961,
              'foreign_key_violations': 0,
              'duplicate_open_periods': 0,
          }
          if metrics != expected_metrics or integrity != [['ok']]:
              raise SystemExit(f'production_integrity_mismatch:{metrics}:{integrity}')

          evidence = {
              'result': 'success',
              'mode': 'initial_product_homologation_backfill',
              'normalization_version': 'product-homologation-v1',
              'updated_at_utc': '2026-09-05T04:42:32Z',
              'preflight': before,
              'backfill': result,
              'postflight': after,
              'comparison_status': statuses,
              'metrics': metrics,
              'integrity_check': 'ok',
              'staging_table_present': False,
          }
          out = Path('run-artifacts/homologation/production-initial.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('HOMOLOGATION_PRODUCTION=' + json.dumps(evidence, sort_keys=True))
          PY

      - name: Publicar evidencia
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: product-homologation-production-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/homologation/production-initial.json
          if-no-files-found: error
          retention-days: 30
