name: Precios SPS - Refrescar homologación derivada

on:
  workflow_run:
    workflows:
      - "La Colonia - Actualización MVP"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precios-sps-homologation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      ${{ github.repository == 'Jchernand3z19/Portafolio' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refrescar perfiles derivados
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          mkdir -p run-artifacts/homologation
          python scripts/backfill_homologacion_turso.py \
            --updated-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee run-artifacts/homologation/daily-refresh.json

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: product-homologation-refresh-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/homologation/daily-refresh.json
          if-no-files-found: warn
          retention-days: 14
