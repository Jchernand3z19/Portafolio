name: Precios SPS - hardening temporal homologación

on:
  push:
    branches:
      - feature/product-homologation-persistence
    paths:
      - ".github/workflows/precios-supermercados-sps-homologation-hardening-temp.yml"
      - "precios-supermercados-sps/scripts/endurecer_backfill_homologacion_temp.py"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/product-homologation-persistence
          persist-credentials: true

      - name: Aplicar hardening idempotente
        run: python precios-supermercados-sps/scripts/endurecer_backfill_homologacion_temp.py

      - name: Publicar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios-supermercados-sps/scripts/backfill_homologacion_turso.py \
                  precios-supermercados-sps/src/precios_supermercados/product_homologation_persistence.py \
                  precios-supermercados-sps/tests/test_product_homologation_persistence.py
          git commit -m "fix(precios): endurece backfill de homologación"
          git push origin HEAD:feature/product-homologation-persistence
