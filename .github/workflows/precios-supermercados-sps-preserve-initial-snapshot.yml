name: Precios SPS - Preservar snapshot inicial

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/precios-supermercados-sps-preserve-initial-snapshot.yml"

permissions:
  actions: read
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar artifact histórico exacto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "9590684834"
          EXPECTED_JSON_SHA256: "2780eeffa5ef62f2d1c8c2c8365e88da1ca0006622d2f7b1c3529f834c9b5e50"
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output source-artifact.zip

          mkdir preserved
          unzip -q source-artifact.zip -d preserved

          actual_files="$(find preserved -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected_files="$(printf '%s\n' full-catalog.csv full-catalog.json | sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "artifact_file_set_mismatch" >&2
            printf 'actual:\n%s\n' "$actual_files" >&2
            exit 1
          fi

          printf '%s  %s\n' "$EXPECTED_JSON_SHA256" "preserved/full-catalog.json" \
            | sha256sum --check --strict

          python3 - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("preserved/full-catalog.json").read_text(encoding="utf-8"))
          expected = {
              "result": "success",
              "supermarket_id": "la_colonia",
              "location_id": "la_colonia_sps",
              "catalog_complete": True,
              "validation_passed": True,
              "location_verified_same_run": True,
              "catalog_products_reported": 9437,
              "unique_products_extracted": 9437,
              "skus_extracted": 9439,
              "skus_with_price": 9439,
              "catalog_product_coverage": 1.0,
              "extraction_enabled": False,
          }
          for field, expected_value in expected.items():
              if value.get(field) != expected_value:
                  raise SystemExit(f"snapshot_metadata_mismatch:{field}")
          products = value.get("products")
          if not isinstance(products, list) or len(products) != 9439:
              raise SystemExit("snapshot_product_count_mismatch")
          PY

      - name: Publicar copia preservada
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-sps-initial-snapshot-32922877781
          path: preserved/
          if-no-files-found: error
          retention-days: 90
