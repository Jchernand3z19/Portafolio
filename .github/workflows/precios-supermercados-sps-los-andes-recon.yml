name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect known public frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Authorization window from the user: 2026-09-04T01:13:02Z through
          # 2026-09-05T01:13:02Z. This phase performs exactly one public GET,
          # read-only, with no cookies/login/cart/checkout/mutations/retries.
          bundle='https://comisariatolosandes.com/main-QMN3KKEM.js'
          curl --compressed --fail --silent --show-error --location \
            --max-time 20 --retry 0 "$bundle" -o "$tmp/main.js"

          echo '=== bundle fingerprint ==='
          printf 'bytes=%s\n' "$(wc -c < "$tmp/main.js")"
          printf 'sha256=%s\n' "$(sha256sum "$tmp/main.js" | awk '{print $1}')"

          python - "$tmp/main.js" <<'PY'
          import re, sys

          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()

          def contexts(label, pattern, radius=900, limit=12):
              print(f'=== {label} ===')
              seen = set()
              count = 0
              for m in re.finditer(pattern, text, re.I):
                  start = max(0, m.start() - radius)
                  end = min(len(text), m.end() + radius)
                  snippet = text[start:end].replace('\n', ' ')
                  key = snippet[:250]
                  if key in seen:
                      continue
                  seen.add(key)
                  print(snippet)
                  print('\n---')
                  count += 1
                  if count >= limit:
                      break

          contexts('product API calls', r'getProducts(?:Search)?\s*\(')
          contexts('location/store API calls', r'(?:get|load|fetch|search|find)[A-Za-z0-9_]*(?:Store|Location|City|Cities|Agency|Agencies)[A-Za-z0-9_]*\s*\(')
          contexts('http client calls', r'\.(?:get|post)\s*\(')
          contexts('known service/config symbols', r'(?:url_amazon_s3|providerId|businessPartner|officeCode|storeId|priceList|defaultDeliveryType)')

          print('=== absolute URLs ===')
          urls = sorted(set(re.findall(r'https?://[^"\'`\\\s<>]+', text)))
          for u in urls[:200]:
              print(u.rstrip('),;'))

          print('=== dynamic chunks ===')
          chunks = []
          for c in re.findall(r'import\(["\']\./([^"\']+\.js)["\']\)', text):
              if c not in chunks:
                  chunks.append(c)
          print(f'chunk_count={len(chunks)}')
          for c in chunks[:200]:
              print(c)
          PY
