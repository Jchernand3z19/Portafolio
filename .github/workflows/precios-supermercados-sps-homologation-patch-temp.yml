name: Precios SPS - parche temporal homologación

on:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/precios-supermercados-sps-homologation-patch-temp.yml"

permissions:
  contents: read

jobs:
  patch:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/product-homologation-persistence' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar rama
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/product-homologation-persistence
          persist-credentials: true

      - name: Aplicar parche idempotente
        run: python precios-supermercados-sps/scripts/ajustar_preflight_homologacion_temp.py

      - name: Publicar cambio
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios-supermercados-sps/scripts/actualizar_mvp_turso_la_colonia.py
          git commit -m "fix(precios): permite tabla derivada en preflight diario"
          git push origin HEAD:feature/product-homologation-persistence
