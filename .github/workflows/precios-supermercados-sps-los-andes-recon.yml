name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover public frontend contract
        shell: bash
        run: |
          set -euo pipefail
          base='https://comisariatolosandes.com'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # One public read-only page request. No cookies, login, age-gate action,
          # cart, checkout, images, or mutations are performed.
          curl --compressed --fail --silent --show-error --location \
            --max-time 20 --retry 0 "$base/todos" -o "$tmp/index.html"

          echo '=== response fingerprints ==='
          printf 'html_bytes=%s\n' "$(wc -c < "$tmp/index.html")"
          printf 'html_sha256=%s\n' "$(sha256sum "$tmp/index.html" | awk '{print $1}')"

          python - "$tmp/index.html" > "$tmp/scripts.txt" <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          import sys

          base = 'https://comisariatolosandes.com/'
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script': return
                  d=dict(attrs); src=d.get('src')
                  if not src: return
                  u=urljoin(base, src)
                  if urlparse(u).netloc == 'comisariatolosandes.com': self.scripts.append(u)
          p=P(); p.feed(open(sys.argv[1], encoding='utf-8', errors='replace').read())
          for u in dict.fromkeys(p.scripts): print(u)
          PY

          script_count="$(wc -l < "$tmp/scripts.txt" | tr -d ' ')"
          echo "script_count=$script_count"
          if [ "$script_count" -gt 20 ]; then
            echo 'Refusing to fetch more than 20 same-origin scripts.' >&2
            exit 2
          fi

          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1))
            curl --compressed --fail --silent --show-error --location \
              --max-time 20 --retry 0 "$url" -o "$tmp/script-$n.js"
          done < "$tmp/scripts.txt"

          echo '=== script URLs ==='
          cat "$tmp/scripts.txt"
          echo '=== candidate absolute URLs / API paths ==='
          if compgen -G "$tmp/script-*.js" > /dev/null; then
            cat "$tmp"/script-*.js \
              | tr '"' '\n' \
              | tr "'" '\n' \
              | grep -Eo '(https?://[^[:space:]<>]+|/[A-Za-z0-9._~!$&()*+,;=:@%/-]*(api|graphql|producto|product|catalog|categoria|category|ciudad|city|sucursal|store|location)[A-Za-z0-9._~!$&()*+,;=:@%/?-]*)' \
              | sed -E 's/[),;]+$//' \
              | sort -u \
              | head -n 250 || true
          fi

          echo '=== keyword contexts ==='
          if compgen -G "$tmp/script-*.js" > /dev/null; then
            grep -aEio '.{0,100}(graphql|api|products?|productos?|catalog|categories|categorias|stores?|sucursales?|cities|ciudades|locations?|inventario|inventory|precio|price).{0,180}' "$tmp"/script-*.js \
              | head -n 300 || true
          fi
