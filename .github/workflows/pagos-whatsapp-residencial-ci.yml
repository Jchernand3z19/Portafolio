name: Pagos WhatsApp Residencial CI

on:
  pull_request:
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'

permissions:
  contents: read

concurrency:
  group: pagos-whatsapp-residencial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pagos-whatsapp-residencial
    env:
      APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pagos-whatsapp-residencial/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
