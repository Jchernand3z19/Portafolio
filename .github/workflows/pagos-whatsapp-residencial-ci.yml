name: Pagos WhatsApp Residencial CI

on:
  pull_request:
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'

permissions:
  contents: read

concurrency:
  group: pagos-whatsapp-residencial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pagos-whatsapp-residencial
    env:
      APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
