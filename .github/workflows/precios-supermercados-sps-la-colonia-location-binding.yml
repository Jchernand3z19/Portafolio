name: La Colonia - Binding público read-only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/requests/la-colonia-location-binding-standing-request.json

permissions:
  contents: read

concurrency:
  group: la-colonia-location-binding-read-only
  cancel-in-progress: false

jobs:
  binding:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_state: ${{ steps.report.outputs.run_state }}
      stop_reason: ${{ steps.report.outputs.stop_reason }}
      technical_binding_observed: ${{ steps.report.outputs.technical_binding_observed }}
      granularity_candidate: ${{ steps.report.outputs.granularity_candidate }}
      confidence: ${{ steps.report.outputs.confidence }}
      visible_location: ${{ steps.report.outputs.visible_location }}
      logical_actions: ${{ steps.report.outputs.logical_actions }}
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validar solicitud autónoma versionada
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/workflows/requests/la-colonia-location-binding-standing-request.json')
          if not path.is_file():
              raise SystemExit('standing_request_missing')
          value = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 'precios-sps-standing-public-readonly-location-binding/v1',
              'standingAuthorizationAt': '2026-08-23T21:02:02Z',
              'targetUrl': 'https://www.lacolonia.com/',
              'targetCity': 'San Pedro Sula',
              'authority': False,
          }
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f'standing_request_invalid:{key}')
          sequence = value.get('requestSequence')
          if not isinstance(sequence, int) or isinstance(sequence, bool) or sequence < 1:
              raise SystemExit('standing_request_sequence_invalid')
          purpose = value.get('purpose')
          if purpose != 'verify-location-binding':
              raise SystemExit('standing_request_purpose_invalid')
          PY
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias cerradas
        shell: bash
        run: python -m pip install -r precios-supermercados-sps/requirements.txt
      - name: Ejecutar observación bounded de binding
        id: binding
        shell: bash
        run: |
          set +e
          python precios-supermercados-sps/scripts/diagnosticar_binding_ubicacion_la_colonia.py \
            --standing-public-read-only \
            --output-path precios-supermercados-sps/diagnostic-artifacts/location-binding-radiography.json
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publicar artefacto sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-location-binding-${{ github.run_id }}
          path: precios-supermercados-sps/diagnostic-artifacts/location-binding-radiography.json
          if-no-files-found: error
          retention-days: 14
      - name: Resumir evidencia sanitizada
        id: report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['GITHUB_OUTPUT'])
          artifact = Path('precios-supermercados-sps/diagnostic-artifacts/location-binding-radiography.json')

          def clean(value, default='unknown'):
              if value is None:
                  return default
              text = ' '.join(str(value).split()).strip()
              return (text or default)[:120]

          if not artifact.is_file():
              values = {
                  'run_state': 'artifact_missing',
                  'stop_reason': 'artifact_missing',
                  'technical_binding_observed': 'false',
                  'granularity_candidate': 'unknown',
                  'confidence': 'unknown',
                  'visible_location': 'unknown',
                  'logical_actions': '0',
              }
          else:
              data = json.loads(artifact.read_text(encoding='utf-8'))
              binding = data.get('binding_report')
              binding = binding if isinstance(binding, dict) else {}
              stop_reason = data.get('stop_reason')
              values = {
                  'run_state': 'completed' if stop_reason is None else 'stopped',
                  'stop_reason': clean(stop_reason, 'none'),
                  'technical_binding_observed': (
                      'true' if binding.get('technical_binding_observed') is True else 'false'
                  ),
                  'granularity_candidate': clean(binding.get('granularity_candidate')),
                  'confidence': clean(binding.get('confidence')),
                  'visible_location': clean(data.get('visible_location')),
                  'logical_actions': clean(data.get('logical_actions'), '0'),
              }
          with output.open('a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          PY
      - name: Reflejar conclusión técnica
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.binding.outputs.exit_code }}"
          case "$exit_code" in
            "0") exit 0 ;;
            "2") exit 2 ;;
            "3") exit 3 ;;
            *) exit 5 ;;
          esac

  publish-status:
    needs:
      - binding
    if: ${{ always() && github.repository == 'Jchernand3z19/Portafolio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      RUN_STATE: ${{ needs.binding.outputs.run_state }}
      STOP_REASON: ${{ needs.binding.outputs.stop_reason }}
      TECHNICAL_BINDING: ${{ needs.binding.outputs.technical_binding_observed }}
      GRANULARITY: ${{ needs.binding.outputs.granularity_candidate }}
      CONFIDENCE: ${{ needs.binding.outputs.confidence }}
      VISIBLE_LOCATION: ${{ needs.binding.outputs.visible_location }}
      LOGICAL_ACTIONS: ${{ needs.binding.outputs.logical_actions }}
    steps:
      - name: Publicar estados del resultado
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const runState = process.env.RUN_STATE || 'unknown';
            const stopReason = process.env.STOP_REASON || 'unknown';
            const technical = process.env.TECHNICAL_BINDING === 'true';
            const granularity = process.env.GRANULARITY || 'unknown';
            const confidence = process.env.CONFIDENCE || 'unknown';
            const visibleLocation = process.env.VISIBLE_LOCATION || 'unknown';
            const logicalActions = process.env.LOGICAL_ACTIONS || '0';
            const targetUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const runOk = runState === 'completed';
            const locationOk = visibleLocation.toLocaleLowerCase() === 'san pedro sula';
            const bindingOk = runOk && locationOk && technical;

            const statuses = [
              {
                context: 'precios-sps/location-binding-run',
                state: runOk ? 'success' : 'failure',
                description: runOk
                  ? `bounded observation completed; actions=${logicalActions}`
                  : `observation ${runState}; stop=${stopReason}`,
              },
              {
                context: 'precios-sps/location-binding-location',
                state: locationOk ? 'success' : 'failure',
                description: `visible_location=${visibleLocation}`,
              },
              {
                context: 'precios-sps/location-binding-readonly',
                state: bindingOk ? 'success' : 'failure',
                description: `binding=${technical}; granularity=${granularity}; confidence=${confidence}`,
              },
            ];

            for (const status of statuses) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: status.state,
                context: status.context,
                description: status.description.slice(0, 140),
                target_url: targetUrl,
              });
            }
