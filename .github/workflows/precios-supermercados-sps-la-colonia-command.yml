name: La Colonia - Despachador seguro por archivo

on:
  pull_request_target:
    types: [synchronize]
    paths:
      - precios-supermercados-sps/.automation/la-colonia-live-command.json

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: la-colonia-file-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código confiable desde main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procesar y despachar con código confiable
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const controller = require('./precios-supermercados-sps/scripts/controlar_solicitud_archivo_la_colonia_observable.js');
            await controller.run({ github, context, core });

      - name: Conservar resultado operacional del controlador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-colonia-file-dispatch-${{ github.run_id }}
          path: dispatcher-result.json
          if-no-files-found: error
          retention-days: 1

