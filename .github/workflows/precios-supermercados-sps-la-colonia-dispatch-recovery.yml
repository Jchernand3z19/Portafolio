name: Precios SPS - Recuperación diaria controlada

on:
  schedule:
    - cron: "17 14 * * *" # 08:17 America/Tegucigalpa
    - cron: "17 18 * * *" # 12:17 America/Tegucigalpa
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: precios-sps-daily-recovery
  cancel-in-progress: false

jobs:
  recover-daily-update:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Comprobar si el corte productivo de hoy ya está completo
        id: daily_cut
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set +e
          mkdir -p run-artifacts/recovery
          python scripts/comprobar_corte_diario_turso.py \
            | tee run-artifacts/recovery/daily-cut.json
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "0" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" = "3" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Reintentar sólo una ejecución programada fallida y acotada
        if: ${{ steps.daily_cut.outputs.complete == 'false' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/recuperar_actualizacion_diaria.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow precios-supermercados-sps-la-colonia-mvp-update.yml \
            | tee run-artifacts/recovery/recovery-decision.json

      - name: Publicar evidencia de recuperación
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: precios-sps-daily-recovery-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/recovery/
          if-no-files-found: warn
          retention-days: 14
