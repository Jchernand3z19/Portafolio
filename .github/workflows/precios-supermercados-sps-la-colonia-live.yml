name: La Colonia - Prueba live controlada

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/src/precios_supermercados/scrapers/**"
      - "precios-supermercados-sps/scripts/probar_la_colonia.py"
      - "precios-supermercados-sps/config/supermercados/la-colonia.yaml"
      - ".github/workflows/precios-supermercados-sps-la-colonia-live.yml"

permissions:
  contents: read

jobs:
  live-controlled:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/la-colonia-scraper'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: precios-supermercados-sps

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar muestra pública de cinco productos
        run: python scripts/probar_la_colonia.py --limit 5
