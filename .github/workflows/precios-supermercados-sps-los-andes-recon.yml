name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve public API service endpoints
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base='https://comisariatolosandes.com'

          # User authorization window: 2026-09-04T01:13:02Z through
          # 2026-09-05T01:13:02Z. Public read-only bundle inspection only.
          # Concurrency 1, no retries/cookies/login/cart/checkout/mutations.
          files=(
            chunk-3RVGB5MK.js
            chunk-KACWDGJI.js
            chunk-CMVDC4NV.js
            chunk-BBQA5YXX.js
            chunk-BGJEFN5N.js
            chunk-XPLU7MLV.js
            chunk-KESYAQWM.js
            chunk-UALGFQGO.js
            chunk-WBUEVQKI.js
          )
          for f in "${files[@]}"; do
            curl --compressed --fail --silent --show-error --location \
              --max-time 20 --retry 0 "$base/$f" -o "$tmp/$f"
            printf '%s bytes=%s sha256=%s\n' "$f" "$(wc -c < "$tmp/$f")" "$(sha256sum "$tmp/$f" | awk '{print $1}')"
            sleep 0.7
          done

          python - "$tmp" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          texts = {p.name: p.read_text(encoding='utf-8', errors='replace') for p in root.glob('*.js')}

          def compact(s):
              return re.sub(r'\s+', ' ', s)

          def contexts(label, pattern, radius=900, limit=30):
              print(f'=== {label} ===')
              count=0
              for name,text in texts.items():
                  for m in re.finditer(pattern,text,re.I):
                      s=max(0,m.start()-radius); e=min(len(text),m.end()+radius)
                      print(f'FILE={name}\n{compact(text[s:e])}\n---')
                      count+=1
                      if count>=limit:return

          contexts('HTTP service calls', r'\.(?:get|post|put|delete)\s*\(', 1100, 80)
          contexts('product API method definitions', r'(?:getProducts|getProductsSearch|getProductsBySlug|getDetailProduct|getDetailProductStore|getDetailProductBySlug|getRelated|getSuggested)\s*\(', 1000, 50)
          contexts('location/store method definitions', r'(?:get|load|search|find)[A-Za-z0-9_]*(?:Location|Locations|Store|Stores|City|Cities|Department|Departments|Agency|Agencies)[A-Za-z0-9_]*\s*\(', 1000, 60)
          contexts('provider and base URL config', r'(?:providerId|defaultDeliveryType|url_api|api_url|apiUrl|baseUrl|url_amazon_s3|office_code)', 1000, 50)
          contexts('SPS/city strings', r'(?:San Pedro Sula|Cort[eé]s|SPS|Honduras)', 800, 30)

          print('=== candidate endpoint/base strings ===')
          vals=set()
          for text in texts.values():
              for s in re.findall(r'["\']([^"\']{2,240})["\']',text):
                  if re.search(r'https?://|/api|product|material|categor|location|store|city|department|agency|agencia|office',s,re.I):
                      vals.add(s)
          for v in sorted(vals):
              if len(v)<=240:
                  print(v)
          PY
