name: La Colonia - Recuperación observable del controlador

on:
  workflow_run:
    workflows:
      - La Colonia - Despachador seguro por archivo
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  expose-controller-result:
    # El controller está globalmente bloqueado y no produce artefactos.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Descargar el código inmutable del workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Descargar resultado sanitizado del controlador
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: la-colonia-file-dispatch-${{ github.event.workflow_run.id }}
          path: controller-result
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validar y exponer recuperación necesaria
        env:
          RESULT_PATH: controller-result/dispatcher-result.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node precios-supermercados-sps/scripts/validar_resultado_controlador_la_colonia.js
