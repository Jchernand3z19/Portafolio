name: Patch La Colonia root total 20260828 v3

on:
  push:
    branches: [fix/la-colonia-root-total-recheck-20260828]
    paths:
      - precios-supermercados-sps/.automation/patch-root-total-20260828-v3.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: precios-supermercados-sps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/la-colonia-root-total-recheck-20260828

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Aplicar parche y probar
        shell: bash
        run: |
          set -euo pipefail
          python .automation/patch_root_total_20260828.py
          python -m pip install -r requirements.txt >/dev/null
          python -m pytest -q tests/test_la_colonia_root_total_recheck.py

      - name: Commit fuente
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/obtener_catalogo_sps_la_colonia_operativo.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: reconcilia total raíz transitorio de La Colonia"
          git push origin HEAD:fix/la-colonia-root-total-recheck-20260828
