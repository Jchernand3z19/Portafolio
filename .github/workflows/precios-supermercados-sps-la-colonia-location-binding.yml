name: La Colonia - Binding público read-only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: la-colonia-location-binding-read-only
  cancel-in-progress: false

jobs:
  binding:
    # El binding técnico SPS ya fue demostrado y quedó persistido en el repositorio.
    # Una nueva observación live requiere autorización humana explícita y vigente
    # para ese nuevo alcance; no existe un standing marker reutilizable.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Entrada live bloqueada
        shell: bash
        run: |
          echo "La observación live de binding está cerrada hasta una autorización humana nueva y explícita."
          exit 1
