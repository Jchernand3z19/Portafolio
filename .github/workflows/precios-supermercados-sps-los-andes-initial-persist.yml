name: Precios SPS - Los Andes initial persist

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-initial-persist.yml'

permissions:
  contents: read
  actions: read

jobs:
  persist:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SOURCE_RUN_ID: '33826831402'
      SOURCE_ARTIFACT_ID: '9920279680'
      SOURCE_ARTIFACT_SHA256: '97e6bebc77bb998d55a2bd4200893a96d010daa87e3d1c0efbaf409bb154d461'
      SOURCE_SNAPSHOT_SHA256: 'a1fe77e3c3132c96c01f7cd792084d47ae25fbb09e3eb69fb67b230d5f09f9fc'
      SOURCE_SNAPSHOT_BYTES: '7189669'
      PERSIST_RUN_ID: 'comisariato-los-andes-initial-33826831402'

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Recuperar artefacto aceptado sin volver a consultar el supermercado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .tmp/los-andes-initial-persist
          mkdir -p .tmp/los-andes-initial-persist/artifact .tmp/los-andes-initial-persist/raw
          curl --fail --silent --show-error --location \
            --retry 0 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o .tmp/los-andes-initial-persist/artifact.zip
          actual_artifact_sha="$(sha256sum .tmp/los-andes-initial-persist/artifact.zip | awk '{print $1}')"
          test "$actual_artifact_sha" = "$SOURCE_ARTIFACT_SHA256"
          unzip -q .tmp/los-andes-initial-persist/artifact.zip -d .tmp/los-andes-initial-persist/artifact
          test -f .tmp/los-andes-initial-persist/artifact/los-andes-capture.tar.gz
          tar -xzf .tmp/los-andes-initial-persist/artifact/los-andes-capture.tar.gz \
            -C .tmp/los-andes-initial-persist/raw
          snapshot=.tmp/los-andes-initial-persist/raw/los-andes-capture/snapshot.json
          test -f "$snapshot"
          actual_snapshot_sha="$(sha256sum "$snapshot" | awk '{print $1}')"
          actual_snapshot_bytes="$(wc -c < "$snapshot" | tr -d ' ')"
          test "$actual_snapshot_sha" = "$SOURCE_SNAPSHOT_SHA256"
          test "$actual_snapshot_bytes" = "$SOURCE_SNAPSHOT_BYTES"
          echo "snapshot=$snapshot" >> "$GITHUB_ENV"

      - name: Validar snapshot antes de cualquier mutación
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_turso_comisariato_los_andes import validate_snapshot_bytes
          snapshot = validate_snapshot_bytes(Path(os.environ['snapshot']).read_bytes())
          assert snapshot['catalog_products_reported'] == 6646
          assert snapshot['unique_products_extracted'] == 6646
          assert snapshot['skus_with_price'] == 6646
          assert snapshot['promotion_counts'] == {'promotion': 120, 'not_promotion': 6526, 'unknown': 0}
          assert snapshot['availability_counts'] == {'unknown': 6646}
          print('snapshot_contract=accepted')
          PY

      - name: Persistir snapshot inicial exacto en Turso
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TURSO_DATABASE_URL:-}"
          test -n "${TURSO_AUTH_TOKEN:-}"
          python scripts/actualizar_mvp_turso_comisariato_los_andes.py \
            "$snapshot" \
            --run-id "$PERSIST_RUN_ID" \
            --source-artifact-id "$SOURCE_ARTIFACT_ID" \
            | tee .tmp/los-andes-initial-persist/persist-result.json

      - name: Verificar commit exacto en Turso
        shell: bash
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_comisariato_los_andes.py \
            "$snapshot" \
            --run-id "$PERSIST_RUN_ID" \
            --verify-only \
            | tee .tmp/los-andes-initial-persist/verify-result.json

      - name: Publicar evidencia de persistencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: los-andes-initial-persist-${{ github.run_id }}
          path: |
            precios-supermercados-sps/.tmp/los-andes-initial-persist/persist-result.json
            precios-supermercados-sps/.tmp/los-andes-initial-persist/verify-result.json
          if-no-files-found: warn
          retention-days: 14
