name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve store query payload
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base='https://comisariatolosandes.com'

          # User authorization window: 2026-09-04T01:13:02Z through
          # 2026-09-05T01:13:02Z. Exactly one public read-only GET.
          # Concurrency 1, no retries/cookies/login/cart/checkout/mutations.
          f='chunk-EBIAV7X2.js'
          curl --compressed --fail --silent --show-error --location \
            --max-time 20 --retry 0 "$base/$f" -o "$tmp/$f"
          printf '%s bytes=%s sha256=%s\n' "$f" "$(wc -c < "$tmp/$f")" "$(sha256sum "$tmp/$f" | awk '{print $1}')"

          python - "$tmp/$f" <<'PY'
          import re, sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()

          print('=== imports ===')
          for stmt in re.findall(r'import\{[^;]+?from"[^"]+";', text):
              print(stmt)

          def around(label, pattern, radius=3200, limit=15):
              print(f'=== {label} ===')
              count=0
              for m in re.finditer(pattern,text,re.I):
                  s=max(0,m.start()-radius); e=min(len(text),m.end()+radius)
                  print(text[s:e])
                  print('---')
                  count+=1
                  if count>=limit:return

          around('loadStoresByCityCode', r'loadStoresByCityCode', 4200, 10)
          around('getStores call', r'\.getStores\s*\(', 3600, 10)
          around('cities derivation', r'\bcities\b', 2800, 12)
          around('location fields', r'location_two', 2600, 12)
          around('filter/body fields', r'(?:business_partner|deliveryType|pickup|cityCode|location_two_code)', 2600, 20)
          PY
