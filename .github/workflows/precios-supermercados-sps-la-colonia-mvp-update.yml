name: La Colonia - Actualización MVP manual

on:
  workflow_dispatch:
    inputs:
      live_read_only_authorized:
        description: Confirma autorización humana explícita vigente para consultar SPS y TGU
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: la-colonia-mvp-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && inputs.live_read_only_authorized == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Descargar catálogo SPS
        id: sps
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_sps_la_colonia_operativo_v2.py \
            --live-read-only \
            --allow-full-catalog \
            --page-size 50 \
            --delay-seconds 1.5 \
            --output run-artifacts/sps/full-catalog.json \
            --csv-output run-artifacts/sps/full-catalog.csv
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogo TGU
        id: tgu
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_tgu_la_colonia_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --page-size 50 \
            --delay-seconds 1.5 \
            --output run-artifacts/tgu/full-catalog.json \
            --csv-output run-artifacts/tgu/full-catalog.csv
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Aceptar sólo snapshots completos
        shell: bash
        env:
          SPS_EXIT: ${{ steps.sps.outputs.exit_code }}
          TGU_EXIT: ${{ steps.tgu.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$SPS_EXIT" = "0"
          test "$TGU_EXIT" = "0"
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes
          for city in ('sps', 'tgu'):
              validate_snapshot_bytes(Path(f'run-artifacts/{city}/full-catalog.json').read_bytes())
          PY

      - name: Persistir directamente en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_la_colonia.py \
            run-artifacts/sps/full-catalog.json \
            --run-id "${GITHUB_RUN_ID}-sps"
          python scripts/actualizar_mvp_turso_la_colonia.py \
            run-artifacts/tgu/full-catalog.json \
            --run-id "${GITHUB_RUN_ID}-tgu"

      - name: Verificar estado aceptado en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_turso_la_colonia import _execute_rows, _pipeline, _stmt

          queries = {
              'products': 'SELECT COUNT(*) FROM products',
              'price_history': 'SELECT COUNT(*) FROM price_history',
              'scrape_runs': 'SELECT COUNT(*) FROM scrape_runs',
              'open_price_history': 'SELECT COUNT(*) FROM price_history WHERE valid_to_utc IS NULL',
              'duplicate_open_periods': '''SELECT COUNT(*) FROM (SELECT product_id,location_id FROM price_history WHERE valid_to_utc IS NULL GROUP BY product_id,location_id HAVING COUNT(*)>1)''',
              'availability': '''SELECT location_id,availability,COUNT(*) FROM price_history WHERE valid_to_utc IS NULL GROUP BY location_id,availability ORDER BY location_id,availability''',
          }
          requests = [
              {'type': 'execute', 'stmt': _stmt(sql)} for sql in queries.values()
          ] + [{'type': 'close'}]
          data = _pipeline(
              os.environ['TURSO_DATABASE_URL'],
              os.environ['TURSO_AUTH_TOKEN'],
              requests,
          )
          results = data['results']
          output = {
              name: _execute_rows(results[index])
              for index, name in enumerate(queries)
          }
          if output['duplicate_open_periods'] != [[0]]:
              raise SystemExit('duplicate_open_periods')
          print(json.dumps(output, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-mvp-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14
