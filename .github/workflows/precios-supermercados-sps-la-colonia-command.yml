name: La Colonia - Despachador seguro por archivo

on:
  pull_request_target:
    types: [synchronize]
    paths:
      - precios-supermercados-sps/.automation/la-colonia-live-command.json

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: la-colonia-file-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch-command:
    # Global fail-closed: no existe autorización live ni evidencia de GATE-17.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código inmutable del workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validar solicitud sin capacidad de despacho
        id: controller
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const controller = require('./precios-supermercados-sps/scripts/controlar_solicitud_archivo_la_colonia.js');
            await controller.run({ github, context, core });

      - name: Conservar resultado operacional del controlador
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: la-colonia-file-dispatch-${{ github.run_id }}
          path: dispatcher-result.json
          if-no-files-found: error
          retention-days: 1
