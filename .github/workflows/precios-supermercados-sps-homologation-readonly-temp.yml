name: Precios SPS - homologación read-only temporal

on:
  push:
    branches:
      - feature/product-homologation-persistence
    paths:
      - ".github/workflows/precios-supermercados-sps-homologation-readonly-temp.yml"

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar fuente y construir perfiles sin escrituras
        working-directory: precios-supermercados-sps
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from backfill_homologacion_turso import _fetch_products, _source_preflight
          from precios_supermercados.product_homologation_persistence import build_homologation_rows

          url = os.environ['TURSO_DATABASE_URL']
          token = os.environ['TURSO_AUTH_TOKEN']
          before = _source_preflight(url, token)
          products = _fetch_products(url, token)
          rows = build_homologation_rows(products, updated_at_utc='2026-09-05T04:31:00Z')
          if len(products) != before['products'] or len(rows) != before['products']:
              raise SystemExit('readonly_coverage_mismatch')
          statuses = {}
          classified = 0
          valid_gtin = 0
          for row in rows:
              statuses[row.comparison_status] = statuses.get(row.comparison_status, 0) + 1
              classified += row.product_type is not None
              valid_gtin += row.canonical_gtin is not None
          print('HOMOLOGATION_READONLY=' + json.dumps({
              'source': before,
              'processed': len(rows),
              'classified_product_type': classified,
              'valid_gtin': valid_gtin,
              'comparison_status': dict(sorted(statuses.items())),
          }, sort_keys=True))
          PY
