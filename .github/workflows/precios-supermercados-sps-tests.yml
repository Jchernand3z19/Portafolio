name: Precios Supermercados SPS - Pruebas base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Compilar src y scripts
        run: python -m compileall precios-supermercados-sps/src precios-supermercados-sps/scripts

      - name: Ejecutar suite completa
        run: pytest precios-supermercados-sps/tests

  observability-marker-heartbeat:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.repository == 'Jchernand3z19/Portafolio' &&
          github.event.pull_request.number == 117 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'diag/precios-sps-observability-request-007' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.changed_files == 1 }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TARGET_PR_NUMBER: "117"
      HEARTBEAT_PATH: ${{ runner.temp }}/observability-ci-heartbeat.json

    steps:
      - name: Preparar heartbeat sanitizado de CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "diagnostic_status": "ci_route_observed",
              "contains_no_event_values": True,
              "production_authority": False,
              "catalog_accepted": False,
          }
          rendered = json.dumps(payload, sort_keys=True, indent=2)
          Path(os.environ["HEARTBEAT_PATH"]).write_text(
              json.dumps({
                  "body": "## Sanitized Workers Observability CI heartbeat\n\n```json\n" + rendered + "\n```"
              }),
              encoding="utf-8",
          )
          PY

      - name: Publicar heartbeat sanitizado de CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
            --input "$HEARTBEAT_PATH"

  observability-marker-diagnostic:
    needs: tests
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.repository == 'Jchernand3z19/Portafolio' &&
          github.event.pull_request.number == 117 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'diag/precios-sps-observability-request-007' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.changed_files == 1 }}
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-probe
    env:
      PROBE_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_PROBE_PUBLIC_KEY_SPKI_B64URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_PR_NUMBER: "117"
      PROBE_DIAGNOSTIC_COMMENT_PATH: ${{ runner.temp }}/probe-shape-ci-comment.json

    steps:
      - name: Preparar fallback sanitizado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "diagnostic_status": "started_without_summary",
              "contains_no_event_values": True,
              "production_authority": False,
              "catalog_accepted": False,
          }
          rendered = json.dumps(payload, sort_keys=True, indent=2)
          Path(os.environ["PROBE_DIAGNOSTIC_COMMENT_PATH"]).write_text(
              json.dumps({
                  "body": "## Sanitized Workers Observability shape diagnostic\n\n```json\n" + rendered + "\n```"
              }),
              encoding="utf-8",
          )
          PY

      - name: Descargar únicamente revisión base confiable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Localizar proyecto de diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          matches = list(workspace.glob("*/scripts/diagnosticar_observability_sonda_cloudflare.py"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one controlled-probe diagnostic project")
          script = matches[0]
          project = script.parents[1]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project}\n")
              env.write(f"DIAGNOSTIC_SCRIPT={script}\n")
              env.write(f"PYTHONPATH={project / 'src'}\n")
          PY

      - name: Configurar Python de diagnóstico
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias verificadas
        shell: bash
        run: python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Descargar sólo artefacto físico firmado existente
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: precios-sps-cloudflare-controlled-probe
          path: .probe-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32551882793

      - name: Inspeccionar forma de telemetría existente
        env:
          PROBE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_PROBE_OBSERVABILITY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_SCRIPT"

      - name: Publicar diagnóstico sanitizado en PR marcador
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
            --input "$PROBE_DIAGNOSTIC_COMMENT_PATH"
