name: Cloudflare controlled probe - Observability shape diagnostic

on:
  push:
    branches:
      - main
      - diag/precios-sps-observability-direct
    paths:
      - precios-supermercados-sps/ops/cloudflare-probe-observability-diagnostic-request.json

permissions:
  contents: read
  actions: read
  issues: write
  statuses: write

concurrency:
  group: cloudflare-controlled-probe-observability-shape-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect-observability-shape:
    if: >-
      ${{ github.repository == 'Jchernand3z19/Portafolio' &&
          (github.ref == 'refs/heads/main' ||
           (github.ref == 'refs/heads/diag/precios-sps-observability-direct' &&
            github.actor == 'Jchernand3z19')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-probe
    env:
      PROBE_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_PROBE_PUBLIC_KEY_SPKI_B64URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_PR_NUMBER: "107"
      PROBE_DIAGNOSTIC_COMMENT_PATH: ${{ runner.temp }}/probe-shape-comment.json
      DIAGNOSTIC_STATUS_CONTEXT: "precios-sps/observability-diagnostic"

    steps:
      - name: Prepare sanitized fallback comment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "diagnostic_status": "started_without_summary",
              "contains_no_event_values": True,
              "production_authority": False,
              "catalog_accepted": False,
          }
          rendered = json.dumps(payload, sort_keys=True, indent=2)
          Path(os.environ["PROBE_DIAGNOSTIC_COMMENT_PATH"]).write_text(
              json.dumps({
                  "body": "## Sanitized Workers Observability shape diagnostic\n\n```json\n" + rendered + "\n```"
              }),
              encoding="utf-8",
          )
          PY

      - name: Publish diagnostic run heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="$DIAGNOSTIC_STATUS_CONTEXT" \
            -f description="Sanitized Observability diagnostic running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout trusted diagnostic revision only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref == 'refs/heads/main' && github.sha || github.event.before }}
          persist-credentials: false

      - name: Validate diagnostic marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("precios-supermercados-sps/ops/cloudflare-probe-observability-diagnostic-request.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          expected_keys = {"schema", "sourceRunId", "purpose", "requestSequence", "authority"}
          if not isinstance(value, dict) or set(value) != expected_keys:
              raise SystemExit("diagnostic marker schema invalid")
          if value["schema"] != "cloudflare-controlled-probe-observability-diagnostic-request-1":
              raise SystemExit("diagnostic marker version invalid")
          if value["sourceRunId"] != "32551882793":
              raise SystemExit("diagnostic source run invalid")
          if value["purpose"] != "sanitized-shape-observation-only":
              raise SystemExit("diagnostic purpose invalid")
          if not isinstance(value["requestSequence"], int) or isinstance(value["requestSequence"], bool) or value["requestSequence"] < 1:
              raise SystemExit("diagnostic request sequence invalid")
          if value["authority"] is not False:
              raise SystemExit("diagnostic marker cannot grant authority")
          PY

      - name: Locate diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          matches = list(workspace.glob("*/scripts/diagnosticar_observability_sonda_cloudflare.py"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one controlled-probe diagnostic project")
          script = matches[0]
          project = script.parents[1]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project}\n")
              env.write(f"DIAGNOSTIC_SCRIPT={script}\n")
              env.write(f"PYTHONPATH={project / 'src'}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install verified dependencies
        shell: bash
        run: python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Download signed source artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: precios-sps-cloudflare-controlled-probe
          path: .probe-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32551882793

      - name: Inspect existing telemetry shape
        env:
          PROBE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_PROBE_OBSERVABILITY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$DIAGNOSTIC_SCRIPT"

      - name: Publish sanitized diagnostic to marker PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid PR number" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
            --input "$PROBE_DIAGNOSTIC_COMMENT_PATH"

      - name: Publish final diagnostic heartbeat
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$DIAGNOSTIC_STATUS_CONTEXT" \
            -f description="Sanitized Observability diagnostic ${JOB_STATUS}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
