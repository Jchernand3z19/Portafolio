name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sample SPS catalog contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          endpoint='https://andes.aveapplications.com/api/em/material/paginate?skip=0&take=6'

          # User authorization window: 2026-09-04T01:13:02Z through
          # 2026-09-05T01:13:02Z. Exactly one public read-only catalog query.
          # SPS store was proven by the previous bounded probe: storeId=1,
          # officeCode=00, location_two_code=501. No auth/cookies/login/cart,
          # checkout/mutations/retries; concurrency is 1.
          cat > "$tmp/request.json" <<'JSON'
          {
            "businessPartner": 1,
            "storeId": 1,
            "groupCode": "0",
            "officeCode": "00",
            "type": "PD",
            "sortBy": "category",
            "sortOption": "ASC",
            "search": "",
            "filter": {
              "priceMin": null,
              "priceMax": null,
              "brand": null,
              "supplier": null,
              "bulletPoint": null,
              "agency": null
            },
            "source": "WEB",
            "hidden": "0"
          }
          JSON

          curl --compressed --fail --silent --show-error --location \
            --max-time 25 --retry 0 \
            -H 'Content-Type: application/json' \
            --data-binary @"$tmp/request.json" \
            "$endpoint" -o "$tmp/catalog.json"

          python - "$tmp/catalog.json" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          print('top_type=', type(payload).__name__)
          if isinstance(payload, dict):
              print('top_keys=', sorted(payload.keys()))
              for key in ('totalItems','totalPages','itemPerPage','currentPage'):
                  if key in payload: print(f'{key}=', payload[key])
          items=payload.get('data',[]) if isinstance(payload,dict) else []
          print('sample_count=', len(items))
          keys=sorted({k for item in items if isinstance(item,dict) for k in item.keys()})
          print('sample_product_keys=', keys)
          fields=(
            'id','code','codeERP','name','slug','brandId','brandName',
            'materialGroupCode','materialGroupName','principalMaterialgroup',
            'newPrice','oldPrice','price','discount','megaDiscount',
            'megaDiscountPercentage','availibilityCount','quantityToBeParent',
            'parentAvailibilityCount','stockAvailableSons','active','active_csm',
            'active_deprecated','idDelete','is_adult','unitMeasureCode','images'
          )
          for item in items:
              if not isinstance(item,dict): continue
              reduced={k:item.get(k) for k in fields if k in item}
              if isinstance(reduced.get('images'),list):
                  reduced['images']=[
                    {k:img.get(k) for k in ('id','fileName','displayName','position','active') if isinstance(img,dict) and k in img}
                    for img in reduced['images'][:2]
                  ]
              print('PRODUCT=', json.dumps(reduced,ensure_ascii=False,sort_keys=True))
          PY
