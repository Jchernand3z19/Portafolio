name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Capturar catálogo SPS completo con presupuesto acotado
        working-directory: precios-supermercados-sps
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/los-andes-capture
          mkdir -p .tmp/los-andes-capture
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, time, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from precios_supermercados.scrapers.comisariato_los_andes import (
              LOCATION_ID, LOCATION_TWO_CODE, OFFICE_CODE, PAGE_SIZE, STORE_ID,
              STORE_ENDPOINT, SUPERMARKET_ID, build_catalog_request,
              build_store_request, reconcile_capture,
          )

          # Autorización del usuario: 2026-09-04T01:13:02Z–2026-09-05T01:13:02Z.
          # Público/read-only; sin login, cookies, age-gate, carrito, checkout ni mutaciones.
          MAX_REQUESTS, MAX_RETRIES, DELAY, TIMEOUT = 400, 10, 0.7, 25
          out = Path('.tmp/los-andes-capture')
          state = {'requests': 0, 'last': 0.0}
          pages = []
          started = time.monotonic()

          def now_z():
              return datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          def post_json(url, body, filename):
              if state['requests'] >= MAX_REQUESTS:
                  raise RuntimeError('request_budget_exhausted')
              elapsed = time.monotonic() - state['last']
              if state['last'] and elapsed < DELAY:
                  time.sleep(DELAY - elapsed)
              req = urllib.request.Request(
                  url,
                  data=json.dumps(body, ensure_ascii=False, separators=(',', ':')).encode(),
                  method='POST',
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                      'User-Agent': 'PreciosSupermercadosSPS/1.0 public-readonly',
                  },
              )
              observed = now_z()
              state['requests'] += 1
              state['last'] = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'http_error:{exc.code}:{filename}') from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(f'network_error:{filename}:{exc.reason}') from exc
              if status not in (200, 201):
                  raise RuntimeError(f'http_status:{status}:{filename}')
              (out / filename).write_bytes(raw)
              try:
                  payload = json.loads(raw)
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise RuntimeError(f'json_invalid:{filename}') from exc
              return payload, {
                  'status': status, 'retries': 0, 'url': url, 'request_body': body,
                  'response_file': filename,
                  'response_sha256': hashlib.sha256(raw).hexdigest(),
                  'response_bytes': len(raw), 'observed_at_utc': observed,
              }

          def fetch_catalog(skip, filename):
              url, body = build_catalog_request(skip, PAGE_SIZE)
              payload, record = post_json(url, body, filename)
              record.update({'skip': skip, 'take': PAGE_SIZE})
              return payload, record

          try:
              _, store_record = post_json(
                  STORE_ENDPOINT, build_store_request(), 'store-evidence.json'
              )
              first, record = fetch_catalog(0, 'page-00000.json')
              total, total_pages = first.get('totalItems'), first.get('totalPages')
              if type(total) is not int or total <= 0 or type(total_pages) is not int:
                  raise RuntimeError('catalog_totals_invalid')
              if total_pages != (total + PAGE_SIZE - 1) // PAGE_SIZE:
                  raise RuntimeError('total_pages_mismatch')
              pages.append(record)
              for skip in range(PAGE_SIZE, total, PAGE_SIZE):
                  payload, record = fetch_catalog(skip, f'page-{skip:05d}.json')
                  if payload.get('totalItems') != total or payload.get('totalPages') != total_pages:
                      raise RuntimeError(f'catalog_total_changed:skip={skip}')
                  pages.append(record)
              final, final_record = fetch_catalog(0, 'final-recheck.json')
              if final.get('totalItems') != total or final.get('totalPages') != total_pages:
                  raise RuntimeError('catalog_total_changed_at_final_recheck')
              ledger = {
                  'closed': True, 'supermarket_id': SUPERMARKET_ID, 'location_id': LOCATION_ID,
                  'store_id': STORE_ID, 'office_code': OFFICE_CODE,
                  'location_two_code': LOCATION_TWO_CODE, 'concurrency': 1,
                  'max_requests': MAX_REQUESTS, 'max_retries': MAX_RETRIES,
                  'delay_seconds': DELAY, 'request_count': state['requests'], 'retry_count': 0,
                  'store_evidence': store_record,
                  'final_total_items': total, 'final_recheck': final_record,
                  'elapsed_seconds': round(time.monotonic() - started, 3), 'pages': pages,
              }
              (out/'ledger.json').write_text(json.dumps(ledger, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
              snapshot = reconcile_capture(out)
              raw_snapshot = json.dumps(snapshot, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode()
              (out/'snapshot.json').write_bytes(raw_snapshot)
              evidence = {
                  'run_result': 'success', 'request_count': state['requests'], 'retry_count': 0,
                  'catalog_products_reported': snapshot['catalog_products_reported'],
                  'unique_products_extracted': snapshot['unique_products_extracted'],
                  'skus_with_price': snapshot['skus_with_price'],
                  'availability_counts': snapshot['availability_counts'],
                  'promotion_counts': snapshot['promotion_counts'],
                  'membership_sha256': snapshot['membership_sha256'],
                  'snapshot_sha256': hashlib.sha256(raw_snapshot).hexdigest(),
                  'snapshot_bytes': len(raw_snapshot), 'elapsed_seconds': ledger['elapsed_seconds'],
                  'store': snapshot['store'],
                  'errors': [],
              }
              (out/'evidence.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
              print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          except Exception as exc:
              (out/'validation-error.txt').write_text(f'{type(exc).__name__}: {exc}\n', encoding='utf-8')
              raise
          PY

      - name: Empaquetar evidencia RAW
        if: always()
        working-directory: precios-supermercados-sps
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .tmp/los-andes-capture ]; then
            tar -czf .tmp/los-andes-capture.tar.gz -C .tmp los-andes-capture
            sha256sum .tmp/los-andes-capture.tar.gz
          fi

      - name: Publicar artefacto de captura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comisariato-los-andes-sps-full-capture
          path: |
            precios-supermercados-sps/.tmp/los-andes-capture.tar.gz
            precios-supermercados-sps/.tmp/los-andes-capture/evidence.json
            precios-supermercados-sps/.tmp/los-andes-capture/validation-error.txt
          if-no-files-found: warn
          retention-days: 14
