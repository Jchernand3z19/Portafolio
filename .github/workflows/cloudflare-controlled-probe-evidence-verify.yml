name: Cloudflare controlled probe - Verify existing evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID that produced the signed probe artifact
        required: true
        type: string
      source_run_attempt:
        description: Physical run attempt encoded in the signed receipt
        required: true
        default: "1"
        type: string
      source_commit_sha:
        description: Commit SHA encoded in the signed receipt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-controlled-probe-evidence-verify-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  verify-existing-evidence:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-probe
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
      PROBE_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_PROBE_PUBLIC_KEY_SPKI_B64URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          run_id = os.environ.get("SOURCE_RUN_ID", "")
          run_attempt = os.environ.get("SOURCE_RUN_ATTEMPT", "")
          commit = os.environ.get("SOURCE_COMMIT_SHA", "")
          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id):
              raise SystemExit("source_run_id invalid")
          if not re.fullmatch(r"[1-9][0-9]{0,2}", run_attempt):
              raise SystemExit("source_run_attempt invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("source_commit_sha invalid")
          PY

      - name: Checkout verifier revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate verifier project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          matches = list(workspace.glob("*/src/precios_supermercados/cloudflare_controlled_probe_verifier.py"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one controlled-probe verifier project")
          project = matches[0].parents[2]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project}\n")
              env.write(f"PYTHONPATH={project / 'src'}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install verified dependencies
        shell: bash
        run: python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Download signed source artifact only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: precios-sps-cloudflare-controlled-probe
          path: .probe-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify signature bytes and original physical identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from precios_supermercados.cloudflare_controlled_probe_verifier import verify_controlled_probe_artifact

          artifact = json.loads(Path(".probe-evidence/cloudflare-probe-result.json").read_text(encoding="utf-8"))
          verified = verify_controlled_probe_artifact(
              artifact,
              public_key_spki_b64url=os.environ["PROBE_PUBLIC_KEY_SPKI_B64URL"],
              expected_commit_sha=os.environ["SOURCE_COMMIT_SHA"],
              expected_run_id=os.environ["SOURCE_RUN_ID"],
              expected_run_attempt=int(os.environ["SOURCE_RUN_ATTEMPT"]),
          )
          if verified.production_authority is not False or verified.catalog_accepted is not False:
              raise SystemExit("Controlled probe evidence cannot grant productive authority")
          PY

      - name: Reconcile existing physical fetch with Workers Observability
        env:
          PROBE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_PROBE_OBSERVABILITY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from precios_supermercados.cloudflare_controlled_probe_observability import (
              ControlledProbeObservabilityError,
          )
          from precios_supermercados.cloudflare_controlled_probe_trace_query import (
              ControlledProbeTraceQueryVerifierClient,
          )
          from precios_supermercados.cloudflare_observability_http_transport import CloudflareObservabilityHttpTransport

          artifact = json.loads(Path(".probe-evidence/cloudflare-probe-result.json").read_text(encoding="utf-8"))
          verifier = ControlledProbeTraceQueryVerifierClient(
              os.environ["CLOUDFLARE_ACCOUNT_ID"],
              CloudflareObservabilityHttpTransport(),
          )

          reconciled = None
          for query_attempt in range(1, 13):
              try:
                  reconciled = verifier.reconcile_artifact(
                      artifact,
                      public_key_spki_b64url=os.environ["PROBE_PUBLIC_KEY_SPKI_B64URL"],
                      expected_commit_sha=os.environ["SOURCE_COMMIT_SHA"],
                      expected_run_id=os.environ["SOURCE_RUN_ID"],
                      expected_run_attempt=int(os.environ["SOURCE_RUN_ATTEMPT"]),
                      bearer_token=os.environ["PROBE_OBSERVABILITY_TOKEN"],
                  )
                  break
              except ControlledProbeObservabilityError as exc:
                  if exc.code != "probe_discovery_trace_missing" or query_attempt == 12:
                      raise
                  print(f"Trace not ingested yet; telemetry query {query_attempt}/12 will retry.")
                  time.sleep(15)

          if reconciled is None:
              raise SystemExit("Observability reconciliation did not complete")
          if reconciled.production_authority is not False or reconciled.catalog_accepted is not False:
              raise SystemExit("Observability evidence cannot grant productive authority")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## Existing controlled probe evidence — PASS\n\n"
              f"- Source run: `{os.environ['SOURCE_RUN_ID']}` / physical attempt `{os.environ['SOURCE_RUN_ATTEMPT']}`\n"
              f"- Source commit: `{os.environ['SOURCE_COMMIT_SHA']}`\n"
              f"- Trace ID: `{reconciled.trace_evidence.trace_id}`\n"
              f"- Fetch span: `{reconciled.trace_evidence.fetch_span_id}`\n"
              f"- Physical evidence ID: `{reconciled.physical_evidence_id}`\n"
              "- Cryptographic verification: **PASS**\n"
              "- Workers Observability reconciliation: **PASS**\n"
              "- `production_authority`: **false**\n"
              "- `catalog_accepted`: **false**\n",
              encoding="utf-8",
          )
          PY
