name: Precios SPS - PR 385 validación live read-only final

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/precios-supermercados-sps-pr385-live-validation.yml
      - precios-supermercados-sps/scripts/obtener_catalogo_walmart_operativo.py
      - precios-supermercados-sps/scripts/obtener_catalogo_pricesmart_operativo.py

permissions:
  contents: read

concurrency:
  group: precios-sps-pr385-live-read-only-final
  cancel-in-progress: false

jobs:
  validate-live:
    if: >-
      ${{ github.repository == 'Jchernand3z19/Portafolio'
          && github.event.pull_request.number == 385
          && github.event.pull_request.head.repo.full_name == 'Jchernand3z19/Portafolio'
          && github.event.pull_request.head.ref == 'feature/daily-all-productive-retailers' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar head exacto del PR sin credenciales persistidas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Walmart Honduras completo dentro del presupuesto remanente
        id: walmart
        continue-on-error: true
        run: |
          python scripts/obtener_catalogo_walmart_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 1.0 \
            --max-requests 608 \
            --max-retries 2 \
            --output-directory run-artifacts/walmart \
            --raw-directory run-artifacts/walmart/raw \
            --evidence-output run-artifacts/walmart/evidence.json

      - name: PriceSmart Honduras completo
        id: pricesmart
        if: always()
        continue-on-error: true
        run: |
          python scripts/obtener_catalogo_pricesmart_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 0.5 \
            --max-requests 80 \
            --max-retries 2 \
            --output-directory run-artifacts/pricesmart \
            --raw-directory run-artifacts/pricesmart/raw \
            --evidence-output run-artifacts/pricesmart/evidence.json

      - name: Validar evidencia y snapshots aceptables sin persistir
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sys
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes

          for evidence_path in (
              'run-artifacts/walmart/evidence.json',
              'run-artifacts/pricesmart/evidence.json',
          ):
              evidence = json.loads(Path(evidence_path).read_text(encoding='utf-8'))
              assert evidence['result'] == 'success', evidence
              assert evidence['request_count'] <= evidence['request_budget'], evidence

          for path, supermarket in (
              ('run-artifacts/walmart/snapshot-walmart-sps.json', 'walmart'),
              ('run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json', 'walmart'),
              ('run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json', 'walmart'),
              ('run-artifacts/pricesmart/snapshot-pricesmart-sps.json', 'pricesmart'),
              ('run-artifacts/pricesmart/snapshot-pricesmart-tgu.json', 'pricesmart'),
          ):
              snapshot = validate_snapshot_bytes(Path(path).read_bytes(), supermarket_id=supermarket)
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True
              assert snapshot['catalog_products_reported'] == snapshot['unique_products_extracted']
          PY

      - name: Publicar evidencia read-only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: pr385-live-read-only-final-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 2
