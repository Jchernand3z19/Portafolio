name: La Colonia - MVP SPS shared session

on:
  push:
    branches:
      - main
    paths:
      - precios-supermercados-sps/.automation/la-colonia-mvp-live-request.json

permissions:
  contents: read

concurrency:
  group: la-colonia-live-catalog-crawl
  cancel-in-progress: false

jobs:
  mvp-sample-shared-session:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar intento condition-bound exacto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "schema_version": "precios-sps-la-colonia-mvp-live-request/v2",
              "authorization_mode": "condition_bound_until_first_downloadable_sample",
              "authorized_at_utc": "2026-08-25T14:41:06Z",
              "authorization_source": "human_user_explicit_chat_instruction",
              "authorization_statement": "no me estes pidiendo autorizacion trabaja hasta que podamos descargar esto",
              "active": True,
              "termination_condition": "first_successful_downloadable_sps_sample",
              "attempt_sequence": 3,
              "trigger_pr_number": 291,
              "supermarket_id": "la_colonia",
              "location_id": "la_colonia_sps",
              "city": "San Pedro Sula",
              "mode": "mvp_sample_shared_browser_session",
              "sample_size": 10,
              "live_read_only": True,
              "same_browser_context": True,
              "max_city_control_reresolutions_per_attempt": 1,
              "max_explicit_product_search_requests_per_attempt": 1,
              "commercial_retries_per_attempt": 0,
              "full_crawl": False,
              "google_sheets_writes": False,
              "commercial_persistence": False,
              "catalog_accepted": False,
              "production_authority": False,
              "extraction_enabled": False,
              "stop_conditions": [
                  "persistent_403",
                  "http_429",
                  "captcha",
                  "login_required",
                  "host_mismatch",
                  "excessive_load_risk",
              ],
          }
          request = json.loads(
              Path(".automation/la-colonia-mvp-live-request.json").read_text(encoding="utf-8")
          )
          if request != expected:
              raise SystemExit("mvp_live_request_mismatch")

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          if event.get("ref") != "refs/heads/main":
              raise SystemExit("mvp_live_push_not_main")
          if (event.get("repository") or {}).get("full_name") != "Jchernand3z19/Portafolio":
              raise SystemExit("mvp_live_repository_mismatch")
          message = str((event.get("head_commit") or {}).get("message") or "")
          expected_prefix = (
              "Merge pull request #291 from "
              "Jchernand3z19/fix/precios-sps-vtexsession-context-attempt-3"
          )
          if not message.startswith(expected_prefix):
              raise SystemExit("mvp_live_merge_identity_mismatch")
          PY

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Obtener muestra SPS
        id: sample
        shell: bash
        run: |
          set +e
          python scripts/probar_muestra_sps_la_colonia_session.py \
            --live-read-only \
            --allow-single-explicit-product-search \
            --sample-size 10 \
            --output run-artifacts/mvp-sample.json
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar muestra de prueba
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-sps-mvp-session-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/mvp-sample.json
          if-no-files-found: error
          retention-days: 14

      - name: Reflejar resultado
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.sample.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "El runner MVP no produjo código de salida." >&2
            exit 1
          fi
          exit "$exit_code"
