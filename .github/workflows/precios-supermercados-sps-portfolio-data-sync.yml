name: Precios SPS - Sincronizar datos estáticos del portafolio

on:
  workflow_run:
    workflows:
      - "Precios SPS - Publicar analítica segura"
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: precios-sps-portfolio-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      ${{ github.repository == 'Jchernand3z19/Portafolio' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar exactamente el artifact RPI ya generado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        with:
          name: safe-analytics-la-colonia-walmart-sps-${{ github.event.workflow_run.id }}
          path: /tmp/precios-sps-safe-analytics
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validar y materializar publicación RPI sin consultar Turso
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          artifact_root = Path('/tmp/precios-sps-safe-analytics')
          expected_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
          ]
          expected_catalog_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'colonial', 'location_id': 'colonial_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
              {'supermarket_id': 'pricesmart', 'location_id': 'pricesmart_sps'},
              {'supermarket_id': 'comisariato_los_andes', 'location_id': 'comisariato_los_andes_sps'},
          ]
          policy = 'fail_closed_strong_identity_and_commercial_consistency'

          def only(filename: str, error_prefix: str) -> Path:
              matches = sorted(artifact_root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'{error_prefix}_cardinality_invalid:{len(matches)}')
              return matches[0]

          def only_outside_v3(filename: str, error_prefix: str) -> Path:
              matches = sorted(
                  path for path in artifact_root.rglob(filename)
                  if path.parent.name != 'consumer-v3'
              )
              if len(matches) != 1:
                  raise SystemExit(f'{error_prefix}_cardinality_invalid:{len(matches)}')
              return matches[0]

          consumer_path = only('consumer-mart.json', 'portfolio_sync_consumer')
          business_path = only('business-mart.json', 'portfolio_sync_business')
          manifest_path = only_outside_v3('manifest.json', 'portfolio_sync_manifest')
          sample_path = only('portfolio-sample.json', 'portfolio_sync_sample')
          catalog_manifests = sorted(
              path for path in artifact_root.rglob('manifest.json')
              if path.parent.name == 'consumer-v3'
          )
          if len(catalog_manifests) != 1:
              raise SystemExit(f'portfolio_sync_catalog_manifest_cardinality_invalid:{len(catalog_manifests)}')
          catalog_manifest_path = catalog_manifests[0]

          consumer = json.loads(consumer_path.read_text(encoding='utf-8'))
          business = json.loads(business_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          sample = json.loads(sample_path.read_text(encoding='utf-8'))
          catalog_manifest = json.loads(catalog_manifest_path.read_text(encoding='utf-8'))

          if consumer.get('schema') != 'rpi-consumer-mart/v2':
              raise SystemExit('portfolio_sync_consumer_schema_invalid')
          if business.get('schema') != 'rpi-business-mart/v1':
              raise SystemExit('portfolio_sync_business_schema_invalid')
          if manifest.get('schema') != 'rpi-marts-manifest/v1':
              raise SystemExit('portfolio_sync_manifest_schema_invalid')
          if sample.get('schema') != 'precios-sps-safe-portfolio-sample/v1':
              raise SystemExit('portfolio_sync_sample_schema_invalid')
          if manifest.get('source_backend') != 'turso':
              raise SystemExit('portfolio_sync_backend_invalid')
          if catalog_manifest.get('schema') != 'rpi-consumer-catalog-manifest/v3':
              raise SystemExit('portfolio_sync_catalog_schema_invalid')
          if catalog_manifest.get('catalog_schema') != 'rpi-consumer-catalog/v3':
              raise SystemExit('portfolio_sync_catalog_contract_invalid')
          if catalog_manifest.get('source_backend') != 'turso':
              raise SystemExit('portfolio_sync_catalog_backend_invalid')
          if catalog_manifest.get('scope') != expected_catalog_scope:
              raise SystemExit('portfolio_sync_catalog_scope_invalid')
          if catalog_manifest.get('public_boundary') != {
              'direct_turso_reads': 0,
              'contains_business_mart': False,
              'contains_raw': False,
              'contains_review_queue': False,
          }:
              raise SystemExit('portfolio_sync_catalog_boundary_invalid')
          if manifest.get('business_schema') != business['schema'] or manifest.get('consumer_schema') != consumer['schema']:
              raise SystemExit('portfolio_sync_schema_crosscheck_invalid')

          for document, error in (
              (consumer, 'portfolio_sync_consumer_policy_invalid'),
              (business, 'portfolio_sync_business_policy_invalid'),
              (sample, 'portfolio_sync_sample_policy_invalid'),
          ):
              if document.get('comparison_policy') != policy:
                  raise SystemExit(error)
          if (
              consumer.get('comparison_status') != 'COMPARABLE'
              or business.get('comparison_status') != 'COMPARABLE'
              or manifest.get('comparison_status') != 'COMPARABLE'
          ):
              raise SystemExit('portfolio_sync_comparison_not_available')
          if (
              consumer.get('scope') != expected_scope
              or business.get('scope') != expected_scope
              or manifest.get('scope') != expected_scope
              or sample.get('scope') != expected_scope
          ):
              raise SystemExit('portfolio_sync_scope_invalid')

          products = consumer.get('products')
          rows = sample.get('rows')
          if not isinstance(products, list) or consumer.get('product_count') != len(products):
              raise SystemExit('portfolio_sync_product_count_invalid')
          if len(products) != manifest.get('safe_products') or not products:
              raise SystemExit('portfolio_sync_product_count_mismatch')
          offer_count = sum(
              len(product.get('offers', []))
              for product in products
              if isinstance(product, dict) and isinstance(product.get('offers'), list)
          )
          if offer_count != manifest.get('safe_offers'):
              raise SystemExit('portfolio_sync_offer_count_mismatch')
          if not isinstance(rows, list) or sample.get('row_count') != len(rows) or not (0 < len(rows) <= 10):
              raise SystemExit('portfolio_sync_sample_cardinality_invalid')
          if sample.get('source_schema') != consumer['schema'] or sample.get('source_as_of') != consumer.get('as_of'):
              raise SystemExit('portfolio_sync_sample_source_mismatch')

          hashes = manifest.get('files_sha256')
          if not isinstance(hashes, dict) or not hashes:
              raise SystemExit('portfolio_sync_hash_manifest_invalid')
          mart_root = manifest_path.parent
          for relative, expected_hash in hashes.items():
              relative_path = Path(relative)
              if relative_path.is_absolute() or '..' in relative_path.parts:
                  raise SystemExit('portfolio_sync_hash_path_invalid')
              path = mart_root / relative_path
              if not path.is_file():
                  raise SystemExit(f'portfolio_sync_hash_file_missing:{relative}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected_hash:
                  raise SystemExit(f'portfolio_sync_hash_mismatch:{relative}')
          if hashes.get('consumer-mart.json') != hashlib.sha256(consumer_path.read_bytes()).hexdigest():
              raise SystemExit('portfolio_sync_consumer_hash_mismatch')
          if hashes.get('business-mart.json') != hashlib.sha256(business_path.read_bytes()).hexdigest():
              raise SystemExit('portfolio_sync_business_hash_mismatch')

          catalog_root = catalog_manifest_path.parent
          catalog_files = catalog_manifest.get('files')
          if not isinstance(catalog_files, list) or not catalog_files:
              raise SystemExit('portfolio_sync_catalog_files_invalid')
          if catalog_manifest.get('visible_rows', 0) <= 0 or catalog_manifest.get('partition_count', 0) <= 0:
              raise SystemExit('portfolio_sync_catalog_empty')
          retailer_counts = catalog_manifest.get('retailer_offer_counts')
          if (
              not isinstance(retailer_counts, dict)
              or set(retailer_counts) != {item['supermarket_id'] for item in expected_catalog_scope}
              or any(type(count) is not int or count <= 0 for count in retailer_counts.values())
          ):
              raise SystemExit('portfolio_sync_catalog_retailer_coverage_invalid')
          for item in catalog_files:
              if not isinstance(item, dict):
                  raise SystemExit('portfolio_sync_catalog_file_invalid')
              relative = Path(str(item.get('path', '')))
              if relative.is_absolute() or '..' in relative.parts:
                  raise SystemExit('portfolio_sync_catalog_hash_path_invalid')
              path = catalog_root / relative
              if not path.is_file():
                  raise SystemExit(f'portfolio_sync_catalog_file_missing:{relative}')
              if hashlib.sha256(path.read_bytes()).hexdigest() != item.get('sha256'):
                  raise SystemExit(f'portfolio_sync_catalog_hash_mismatch:{relative}')
              if path.stat().st_size != item.get('bytes'):
                  raise SystemExit(f'portfolio_sync_catalog_size_mismatch:{relative}')

          provenance = {
              'published_at_utc': os.environ['SOURCE_COMPLETED_AT'],
              'source_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
          }
          sample.update(provenance)

          serialized = json.dumps({
              'consumer': consumer,
              'manifest': manifest,
              'sample': sample,
              'catalog_manifest': catalog_manifest,
          }, ensure_ascii=False).casefold()
          serialized += '\n'.join(
              path.read_text(encoding='utf-8', errors='strict').casefold()
              for path in catalog_root.rglob('*.json')
          )
          for forbidden in ('turso_database_url', 'turso_auth_token', 'database_url', 'auth_token', 'libsql://'):
              if forbidden in serialized:
                  raise SystemExit(f'portfolio_sync_secret_material_detected:{forbidden}')

          consumer_target = Path('/tmp/precios-sps-rpi-consumer-mart.json')
          manifest_target = Path('/tmp/precios-sps-rpi-manifest.json')
          sample_target = Path('/tmp/precios-sps-portfolio-sample.json')
          catalog_target = Path('/tmp/precios-sps-rpi-v3')
          shutil.copyfile(consumer_path, consumer_target)
          shutil.copyfile(manifest_path, manifest_target)
          if catalog_target.exists():
              shutil.rmtree(catalog_target)
          shutil.copytree(catalog_root, catalog_target)
          sample_target.write_text(
              json.dumps(sample, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'consumer_schema': consumer['schema'],
              'safe_products': len(products),
              'safe_offers': offer_count,
              'sample_rows': sample['row_count'],
              'source_workflow_run_id': provenance['source_workflow_run_id'],
              'consumer_v3_visible_rows': catalog_manifest['visible_rows'],
              'consumer_v3_source_offers': catalog_manifest['source_offers'],
              'consumer_v3_partitions': catalog_manifest['partition_count'],
          }, sort_keys=True))
          PY

      - name: Actualizar Consumer Mart y muestra en un solo commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        env:
          CONSUMER_MART_PATH: /tmp/precios-sps-rpi-consumer-mart.json
          RPI_MANIFEST_PATH: /tmp/precios-sps-rpi-manifest.json
          PUBLIC_SAMPLE_PATH: /tmp/precios-sps-portfolio-sample.json
          RPI_V3_ROOT: /tmp/precios-sps-rpi-v3
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dataBranch = 'portfolio-data';
            const targets = [
              {
                sourcePath: process.env.CONSUMER_MART_PATH,
                targetPath: 'precios-supermercados-sps/published/rpi/consumer-mart.json',
              },
              {
                sourcePath: process.env.RPI_MANIFEST_PATH,
                targetPath: 'precios-supermercados-sps/published/rpi/manifest.json',
              },
              {
                sourcePath: process.env.PUBLIC_SAMPLE_PATH,
                targetPath: 'precios-supermercados-sps/portfolio/sample-data.json',
              },
            ];

            function walk(root, relative = '') {
              return fs.readdirSync(path.join(root, relative), { withFileTypes: true })
                .flatMap((entry) => {
                  const next = path.join(relative, entry.name);
                  return entry.isDirectory() ? walk(root, next) : [next];
                });
            }
            for (const relative of walk(process.env.RPI_V3_ROOT)) {
              targets.push({
                sourcePath: path.join(process.env.RPI_V3_ROOT, relative),
                targetPath: `precios-supermercados-sps/published/rpi/v3/${relative.split(path.sep).join('/')}`,
              });
            }

            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${dataBranch}`,
            });
            const parentSha = ref.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: parentSha,
            });

            const parentTree = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: parentCommit.data.tree.sha,
              recursive: 'true',
            });

            const tree = [];
            const targetPaths = new Set(targets.map((target) => target.targetPath));
            const v3Prefix = 'precios-supermercados-sps/published/rpi/v3/';
            for (const item of parentTree.data.tree) {
              if (item.type === 'blob' && item.path.startsWith(v3Prefix) && !targetPaths.has(item.path)) {
                tree.push({path: item.path, mode: '100644', type: 'blob', sha: null});
              }
            }
            for (const target of targets) {
              const bytes = fs.readFileSync(target.sourcePath);
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: bytes.toString('base64'),
                encoding: 'base64',
              });
              tree.push({
                path: target.targetPath,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              });
            }

            const newTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: parentCommit.data.tree.sha,
              tree,
            });
            const newCommit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `data: publish RPI consumer contracts from run ${context.payload.workflow_run.id}`,
              tree: newTree.data.sha,
              parents: [parentSha],
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${dataBranch}`,
              sha: newCommit.data.sha,
              force: false,
            });
