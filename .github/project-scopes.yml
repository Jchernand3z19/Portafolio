{
  "schema": "portfolio-project-scopes/v1",
  "policy": {
    "shared_project_id": "shared",
    "shared_title_prefix": "[MONOREPO]",
    "shared_branch_prefix": "monorepo/",
    "grandfathered_branches": {
      "feat/rpi-controlled-publication-request": "rpi",
      "feat/pagos-whatsapp-residencial-mvp": "pagos"
    }
  },
  "projects": {
    "rpi": {
      "display_name": "Retail Price Intelligence Platform",
      "root": "precios-supermercados-sps/",
      "title_prefix": "[RPI]",
      "branch_prefix": "rpi/",
      "label": "project:rpi",
      "owned_paths": [
        "precios-supermercados-sps/**",
        ".github/workflows/requests/cloudflare-evidence-verify-request.json"
      ],
      "owned_workflows": [
        ".github/workflows/cloudflare-controlled-probe-evidence-verify.yml",
        ".github/workflows/precios-supermercados-sps-bigquery-first-load.yml",
        ".github/workflows/precios-supermercados-sps-cloudflare-probe.yml",
        ".github/workflows/precios-supermercados-sps-google-sheets-storage.yml",
        ".github/workflows/precios-supermercados-sps-historical-branch-audit.yml",
        ".github/workflows/precios-supermercados-sps-homologation-refresh.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-command.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-diagnostic.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-dispatch-recovery.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-facet-discovery.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-live.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-location-binding.yml",
        ".github/workflows/precios-supermercados-sps-la-colonia-mvp-update.yml",
        ".github/workflows/precios-supermercados-sps-portfolio-data-sync.yml",
        ".github/workflows/precios-supermercados-sps-preserve-initial-snapshot.yml",
        ".github/workflows/precios-supermercados-sps-production-operator.yml",
        ".github/workflows/precios-supermercados-sps-safe-analytics-publication.yml",
        ".github/workflows/precios-supermercados-sps-tests.yml",
        ".github/workflows/precios-supermercados-sps-turso-schema-migration-operator.yml",
        ".github/workflows/precios-supermercados-sps-turso-schema-migration.yml"
      ],
      "public_output_namespaces": ["precios-supermercados-sps/**"],
      "secret_owners": ["TURSO_*", "PRECIOS_SPS_*", "CLOUDFLARE_PROBE_*"]
    },
    "pagos": {
      "display_name": "Pagos residenciales por WhatsApp",
      "root": "pagos-whatsapp-residencial/",
      "title_prefix": "[PAGOS]",
      "branch_prefix": "pagos/",
      "label": "project:pagos",
      "owned_paths": ["pagos-whatsapp-residencial/**"],
      "owned_workflows": [".github/workflows/pagos-whatsapp-residencial-ci.yml"],
      "public_output_namespaces": ["pagos-whatsapp-residencial/**"],
      "secret_owners": ["WHATSAPP_*", "META_*", "PAGOS_*", "GOOGLE_DRIVE_*", "GOOGLE_SHEETS_*"]
    },
    "mundial": {
      "display_name": "Mundial 2026",
      "root": "mundial-2026/",
      "title_prefix": "[MUNDIAL]",
      "branch_prefix": "mundial/",
      "label": "project:mundial",
      "owned_paths": ["mundial-2026/**"],
      "owned_workflows": [
        ".github/workflows/mundial-2026-prediccion-completa.yml",
        ".github/workflows/mundial-2026-prediccion-diaria.yml",
        ".github/workflows/mundial-2026-prediccion-viva.yml"
      ],
      "public_output_namespaces": ["mundial-2026/**"],
      "secret_owners": ["SPREADSHEET_ID", "GOOGLE_CLIENT_EMAIL", "GOOGLE_PRIVATE_KEY"]
    }
  },
  "shared": {
    "label": "project:shared",
    "governance_paths": [
      ".agents/**",
      ".github/project-scopes.yml",
      ".github/pull_request_template.md",
      ".github/scripts/**",
      ".github/workflows/AGENTS.md",
      ".github/workflows/project-scope-check.yml",
      ".gitignore",
      "AGENTS.md",
      "PROJECT_TEMPLATE.md",
      "README.md",
      "docs/**",
      "mundial-2026/AGENTS.md",
      "pagos-whatsapp-residencial/AGENTS.md",
      "precios-supermercados-sps/AGENTS.md"
    ],
    "integrations": {
      "portfolio_site": {
        "paths": [
          ".github/workflows/portfolio-frontend-qa.yml",
          "css/**",
          "index.html",
          "js/**",
          "script.js",
          "tests/portfolio_frontend_smoke.py",
          "tests/project_detail_standard_smoke.py"
        ],
        "allowed_projects": ["rpi", "pagos", "mundial"]
      }
    }
  }
}
