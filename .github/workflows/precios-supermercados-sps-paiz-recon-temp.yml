name: Precios SPS - Paiz reconocimiento temporal

on:
  pull_request:
    branches: [main]
    paths:
      - precios-supermercados-sps/reports/paiz/**
      - .github/workflows/precios-supermercados-sps-paiz-recon-temp.yml
  push:
    branches: [feature/paiz-final-acquisition]
    paths:
      - precios-supermercados-sps/reports/paiz/**
      - .github/workflows/precios-supermercados-sps-paiz-recon-temp.yml

permissions:
  contents: read

concurrency:
  group: precios-sps-paiz-recon-temp
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: precios-supermercados-sps
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Ejecutar reconocimiento Paiz acotado
        run: python reports/paiz/2026-09-03-probe/probe_recon.py

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paiz-recon-${{ github.run_id }}
          path: precios-supermercados-sps/paiz-recon-artifact/
          if-no-files-found: warn
          retention-days: 7
