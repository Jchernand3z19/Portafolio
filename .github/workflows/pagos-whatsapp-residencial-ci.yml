name: Pagos WhatsApp Residencial CI

on:
  pull_request:
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pagos-whatsapp-residencial/**'
      - '.github/workflows/pagos-whatsapp-residencial-ci.yml'

# One-time bootstrap: write is restricted to this same-repository PAGOS branch and
# removed immediately after package-lock.json is committed.
permissions:
  contents: write

concurrency:
  group: pagos-whatsapp-residencial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pagos-whatsapp-residencial
    env:
      APP_MODE: demo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile once
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'feat/pagos-whatsapp-residencial-mvp'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already tracked; nothing to bootstrap.'
            exit 0
          fi
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m '[PAGOS] Add reproducible npm lockfile'
          git push origin "$HEAD_REF"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
