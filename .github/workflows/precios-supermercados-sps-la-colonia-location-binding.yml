name: La Colonia - Radiografía controlada de ubicación

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/requests/la-colonia-location-binding-request.json

permissions:
  contents: read

concurrency:
  group: la-colonia-location-binding-radiography
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.request.outputs.allowed }}
      authorization_id: ${{ steps.request.outputs.authorization_id }}
      request_sequence: ${{ steps.request.outputs.request_sequence }}
    steps:
      - name: Validar autorización versionada y commit exacto
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const marker = '.github/workflows/requests/la-colonia-location-binding-request.json';
            const expectedFiles = [
              '.github/workflows/precios-supermercados-sps-la-colonia-location-binding.yml',
              marker,
              'precios-supermercados-sps/src/precios_supermercados/diagnostics/la_colonia_location_binding_capture.py',
              'precios-supermercados-sps/tests/test_la_colonia_location_binding_capture.py',
              'precios-supermercados-sps/tests/test_la_colonia_location_binding_workflow.py',
              'precios-supermercados-sps/tests/test_workflow_security_audit.py',
            ].sort();
            const expectedAuthorizationId = 'LC-location-binding-336';

            core.setOutput('allowed', 'false');

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const actualFiles = (commit.files || []).map((file) => file.filename).sort();
            if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
              core.setFailed('location_binding_trigger_not_exact_authorized_commit');
              return;
            }

            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: marker,
              ref: context.sha,
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              core.setFailed('location_binding_request_file_invalid');
              return;
            }

            let request;
            try {
              request = JSON.parse(Buffer.from(file.content, file.encoding || 'base64').toString('utf8'));
            } catch (error) {
              core.setFailed('location_binding_request_json_invalid');
              return;
            }

            if (request.schemaVersion !== 'precios-sps-la-colonia-location-binding-request/v1') {
              core.setFailed('location_binding_request_schema_invalid');
              return;
            }
            if (request.authorizationId !== expectedAuthorizationId) {
              core.setFailed('location_binding_authorization_id_not_exact');
              return;
            }
            if (request.requestSequence !== 1) {
              core.setFailed('location_binding_request_sequence_invalid');
              return;
            }
            if (request.targetCity !== 'San Pedro Sula') {
              core.setFailed('location_binding_target_city_invalid');
              return;
            }
            if (request.maxLogicalActions !== 4) {
              core.setFailed('location_binding_budget_invalid');
              return;
            }
            if (request.authority !== false) {
              core.setFailed('location_binding_request_authority_must_be_false');
              return;
            }

            core.setOutput('authorization_id', expectedAuthorizationId);
            core.setOutput('request_sequence', String(request.requestSequence));
            core.setOutput('allowed', 'true');

  radiography:
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      AUTHORIZATION_ID: ${{ needs.preflight.outputs.authorization_id }}
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias cerradas
        shell: bash
        run: python -m pip install -r precios-supermercados-sps/requirements.txt
      - name: Ejecutar única radiografía autorizada
        id: radiography
        shell: bash
        run: |
          set +e
          python precios-supermercados-sps/scripts/diagnosticar_binding_ubicacion_la_colonia.py \
            --authorization-id "$AUTHORIZATION_ID" \
            --output-path precios-supermercados-sps/diagnostic-artifacts/location-binding-radiography.json
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publicar artefacto sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-location-binding-${{ github.run_id }}
          path: precios-supermercados-sps/diagnostic-artifacts/location-binding-radiography.json
          if-no-files-found: error
          retention-days: 14
      - name: Reflejar conclusión técnica
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.radiography.outputs.exit_code }}"
          case "$exit_code" in
            "0") exit 0 ;;
            "2") exit 2 ;;
            "3") exit 3 ;;
            *) exit 5 ;;
          esac
