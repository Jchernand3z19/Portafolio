name: La Colonia - Despachador seguro por archivo

on:
  pull_request_target:
    types: [synchronize]
    paths:
      - precios-supermercados-sps/.automation/la-colonia-live-command.json

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: la-colonia-file-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch-command:
    # Global fail-closed: no existe autorización live ni evidencia de GATE-17.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el código inmutable del workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar solicitud sin capacidad de despacho
        id: controller
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const controller = require('./precios-supermercados-sps/scripts/controlar_solicitud_archivo_la_colonia.js');
            await controller.run({ github, context, core });

      - name: Conservar resultado operacional del controlador
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-file-dispatch-${{ github.run_id }}
          path: dispatcher-result.json
          if-no-files-found: error
          retention-days: 1
