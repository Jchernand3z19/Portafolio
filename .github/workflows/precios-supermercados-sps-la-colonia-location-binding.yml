name: La Colonia - Radiografía completa de ubicación

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/requests/la-colonia-location-binding-reconcile-request.json

permissions:
  contents: read

concurrency:
  group: la-colonia-full-location-radiography
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    steps:
      - name: Validar instrucción humana y commit exacto
        id: guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const markerPath = '.github/workflows/requests/la-colonia-location-binding-reconcile-request.json';
            const expectedFiles = new Set([
              '.github/workflows/precios-supermercados-sps-la-colonia-location-binding.yml',
              markerPath,
              'precios-supermercados-sps/scripts/radiografiar_selector_ubicacion_la_colonia.py',
              'precios-supermercados-sps/tests/test_full_location_radiography.py',
              'precios-supermercados-sps/tests/test_la_colonia_location_binding_workflow.py',
              'precios-supermercados-sps/tests/test_location_binding_337_reconciliation.py',
              'precios-supermercados-sps/tests/test_workflow_security_audit.py',
            ]);
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const actualFiles = new Set((commit.data.files || []).map((file) => file.filename));
            if (actualFiles.size !== expectedFiles.size || [...actualFiles].some((path) => !expectedFiles.has(path))) {
              core.setFailed(`full_radiography_trigger_not_exact_commit:${[...actualFiles].sort().join(',')}`);
              return;
            }
            const markerResponse = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: markerPath,
              ref: context.sha,
            });
            if (Array.isArray(markerResponse.data) || markerResponse.data.type !== 'file') {
              core.setFailed('full_radiography_marker_invalid');
              return;
            }
            const marker = JSON.parse(Buffer.from(markerResponse.data.content, 'base64').toString('utf8'));
            const expected = {
              schemaVersion: 'precios-sps-la-colonia-full-location-radiography-request/v1',
              authorizedAt: '2026-08-23T18:54:18Z',
              authorizationSource: 'explicit-user-instruction',
              targetUrl: 'https://www.lacolonia.com/',
              targetCity: 'San Pedro Sula',
              singleUse: true,
              authority: false,
            };
            if (JSON.stringify(marker) !== JSON.stringify(expected)) {
              core.setFailed('full_radiography_marker_contract_mismatch');
              return;
            }
            core.setOutput('allowed', 'true');

  full-radiography:
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias cerradas
        shell: bash
        run: python -m pip install -r precios-supermercados-sps/requirements.txt
      - name: Ejecutar radiografía estructural completa
        id: radiography
        shell: bash
        run: |
          set +e
          python precios-supermercados-sps/scripts/radiografiar_selector_ubicacion_la_colonia.py \
            --output-dir precios-supermercados-sps/diagnostic-artifacts/full-location-radiography
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publicar evidencia diagnóstica
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-full-location-radiography-${{ github.run_id }}
          path: precios-supermercados-sps/diagnostic-artifacts/full-location-radiography/
          if-no-files-found: error
          retention-days: 14
      - name: Reflejar conclusión de captura
        if: always()
        shell: bash
        run: |
          test "${{ steps.radiography.outputs.exit_code }}" = "0"
