name: Precios SPS - aplica refresh homologación temporal

on:
  push:
    branches:
      - feature/product-homologation-daily-refresh
    paths:
      - ".github/workflows/precios-supermercados-sps-homologation-refresh-patch-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && contains(github.event.head_commit.message, 'ejecuta parche temporal de refresh') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Aplicar parche de código y retirar helper temporal
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('precios-supermercados-sps/scripts/optimizar_refresh_homologacion_temp.py')
          spec = importlib.util.spec_from_file_location('refresh_patch', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.patch_backfill()
          PY
          rm precios-supermercados-sps/scripts/optimizar_refresh_homologacion_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios-supermercados-sps/scripts/backfill_homologacion_turso.py \
                  precios-supermercados-sps/scripts/optimizar_refresh_homologacion_temp.py
          git diff --cached --check
          git commit -m "feat(precios): refresca homologación de forma diferencial"
          git push origin HEAD:feature/product-homologation-daily-refresh
