name: La Colonia - Recorrido live manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Etapa segura del recorrido
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - staged
          - full
      page_size:
        description: Productos solicitados por página
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "50"
      max_pages:
        description: Límite de páginas; 0 usa el valor del modo
        required: true
        default: "2"
        type: string
      max_products:
        description: Límite de productos; 0 desactiva este límite
        required: true
        default: "0"
        type: string
      delay_seconds:
        description: Pausa secuencial entre peticiones
        required: true
        default: "1.5"
        type: string
      profile:
        description: Baseline observa; validation aplica umbrales
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - validation
      max_missing_price_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      max_duplicate_sku_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      max_duplicate_product_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      max_total_change_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      allow_full:
        description: Confirmación manual adicional para el recorrido completo
        required: true
        default: false
        type: boolean
      facet_authorization_id:
        description: Autorización humana explícita para facets SPS; hoy no existe ninguna activa
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: la-colonia-live-catalog-crawl
  cancel-in-progress: false

jobs:
  live-crawl:
    # GATE-17 no tiene evidencia productiva. Este job permanece cerrado incluso
    # cuando alguien invoque workflow_dispatch directamente.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: precios-supermercados-sps

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ejecutar recorrido secuencial controlado
        id: crawl
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PAGE_SIZE: ${{ inputs.page_size }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
          INPUT_MAX_PRODUCTS: ${{ inputs.max_products }}
          INPUT_DELAY_SECONDS: ${{ inputs.delay_seconds }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_MAX_MISSING_PRICE_RATIO: ${{ inputs.max_missing_price_ratio }}
          INPUT_MAX_DUPLICATE_SKU_RATIO: ${{ inputs.max_duplicate_sku_ratio }}
          INPUT_MAX_DUPLICATE_PRODUCT_RATIO: ${{ inputs.max_duplicate_product_ratio }}
          INPUT_MAX_TOTAL_CHANGE_RATIO: ${{ inputs.max_total_change_ratio }}
          INPUT_ALLOW_FULL: ${{ inputs.allow_full }}
        run: |
          set +e
          args=(
            --mode "$INPUT_MODE"
            --page-size "$INPUT_PAGE_SIZE"
            --delay-seconds "$INPUT_DELAY_SECONDS"
            --profile "$INPUT_PROFILE"
            --output-dir run-artifacts
          )

          if [[ "$INPUT_MAX_PAGES" != "0" ]]; then
            args+=(--max-pages "$INPUT_MAX_PAGES")
          fi
          if [[ "$INPUT_MAX_PRODUCTS" != "0" ]]; then
            args+=(--max-products "$INPUT_MAX_PRODUCTS")
          fi
          if [[ -n "$INPUT_MAX_MISSING_PRICE_RATIO" ]]; then
            args+=(--max-missing-price-ratio "$INPUT_MAX_MISSING_PRICE_RATIO")
          fi
          if [[ -n "$INPUT_MAX_DUPLICATE_SKU_RATIO" ]]; then
            args+=(--max-duplicate-sku-ratio "$INPUT_MAX_DUPLICATE_SKU_RATIO")
          fi
          if [[ -n "$INPUT_MAX_DUPLICATE_PRODUCT_RATIO" ]]; then
            args+=(--max-duplicate-product-ratio "$INPUT_MAX_DUPLICATE_PRODUCT_RATIO")
          fi
          if [[ -n "$INPUT_MAX_TOTAL_CHANGE_RATIO" ]]; then
            args+=(--max-total-change-ratio "$INPUT_MAX_TOTAL_CHANGE_RATIO")
          fi
          if [[ "$INPUT_ALLOW_FULL" == "true" ]]; then
            args+=(--allow-full)
          fi

          python scripts/probar_la_colonia.py "${args[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar informe sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-${{ inputs.mode }}-summary
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Construir comentario sanitizado
        if: always()
        continue-on-error: true
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PAGE_SIZE: ${{ inputs.page_size }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
          INPUT_MAX_PRODUCTS: ${{ inputs.max_products }}
          INPUT_DELAY_SECONDS: ${{ inputs.delay_seconds }}
          INPUT_PROFILE: ${{ inputs.profile }}
          RUNNER_EXIT_CODE: ${{ steps.crawl.outputs.exit_code }}
          ARTIFACT_NAME: la-colonia-${{ inputs.mode }}-summary
        run: >-
          python scripts/publicar_resultado_la_colonia.py
          --summary run-artifacts/run-summary.json
          --output run-artifacts/pr-comment.md

      - name: Reflejar aceptación real del recorrido
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.crawl.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "El runner no produjo código de salida." >&2
            exit 1
          fi
          exit "$exit_code"

  context-bound-facet-entrypoint:
    # Preparado offline, pero globalmente cerrado. La allow-list humana en código
    # también está vacía, por lo que una habilitación accidental seguiría fallando
    # antes de OIDC, navegador o tráfico externo.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: la-colonia-live
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      CLOUDFLARE_EDGE_GATEWAY_URL: ${{ vars.CLOUDFLARE_EDGE_GATEWAY_URL }}
      CLOUDFLARE_EDGE_RECEIPT_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_EDGE_RECEIPT_PUBLIC_KEY_SPKI_B64URL }}

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Ejecutar entrypoint context-bound de facets
        id: facets
        shell: bash
        run: |
          set +e
          python precios-supermercados-sps/scripts/ejecutar_facets_context_bound_la_colonia.py \
            --authorization-id "${{ inputs.facet_authorization_id }}" \
            --output-dir precios-supermercados-sps/facet-entrypoint-artifacts
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar sólo evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-context-bound-facets-${{ github.run_id }}
          path: |
            precios-supermercados-sps/facet-entrypoint-artifacts/facet-entrypoint-status.json
            precios-supermercados-sps/facet-entrypoint-artifacts/facet-entrypoint-evidence.json
            precios-supermercados-sps/facet-entrypoint-artifacts/facet-discovery-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reflejar resultado técnico
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.facets.outputs.exit_code }}"
          case "$exit_code" in
            "0"|"2") exit 0 ;;
            *) exit 1 ;;
          esac
