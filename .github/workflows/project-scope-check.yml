name: Monorepo - Project Scope Check

on:
  pull_request:
    paths:
      - ".github/project-scopes.yml"
      - ".github/scripts/validate_project_scope.py"
      - ".github/scripts/test_validate_project_scope.py"
      - ".github/workflows/project-scope-check.yml"
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: monorepo-project-scope-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validator-unit-tests:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed governance revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate registry and scope scenarios
        run: |
          python .github/scripts/test_validate_project_scope.py
          python .github/scripts/validate_project_scope.py \
            --config .github/project-scopes.yml \
            --audit-repository .

  validate-pr-scope:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validator from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .scope-validator
          persist-credentials: false

      - name: Read changed paths from GitHub
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILES_OUTPUT: ${{ runner.temp }}/project-scope-files.txt
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            if (files.length !== context.payload.pull_request.changed_files) {
              core.setFailed('PROJECT_SCOPE_UNRESOLVED: changed-file count mismatch');
              return;
            }
            fs.writeFileSync(process.env.FILES_OUTPUT, files.map(file => file.filename).join('\n') + '\n');

      - name: Enforce project boundary
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          FILES_INPUT: ${{ runner.temp }}/project-scope-files.txt
        run: |
          python .scope-validator/.github/scripts/validate_project_scope.py \
            --config .scope-validator/.github/project-scopes.yml \
            --title "$PR_TITLE" \
            --branch "$PR_BRANCH" \
            --files-file "$FILES_INPUT"
