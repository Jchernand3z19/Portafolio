name: La Colonia - Catalogo SPS operativo

on:
  push:
    branches:
      - main
    paths:
      - precios-supermercados-sps/.automation/la-colonia-full-catalog-request.json

permissions:
  contents: read

concurrency:
  group: la-colonia-sps-full-catalog-operational
  cancel-in-progress: false

jobs:
  full-catalog-operational:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: precios-supermercados-sps

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revision inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar autorizacion del catalogo operativo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "schema_version": "precios-sps-la-colonia-full-catalog-request/v2",
              "authorization_mode": "one_time_full_catalog_operational_scrape",
              "authorized_at_utc": "2026-08-25T21:13:44Z",
              "continued_at_utc": "2026-08-25T22:31:45Z",
              "authorization_source": "human_user_explicit_chat_instruction",
              "authorization_statement": "podes trabajar en obtener todo el catalogo",
              "continuation_statement": "ok comenza a trabajar",
              "active": True,
              "termination_condition": "first_successful_downloadable_full_sps_catalog",
              "attempt_sequence": 7,
              "trigger_pr_number": 304,
              "supermarket_id": "la_colonia",
              "location_id": "la_colonia_sps",
              "city": "San Pedro Sula",
              "mode": "operational_city_brand_partitions_productSearchV3",
              "radiography_execution": False,
              "location_verification": "structural_exact_city_control",
              "page_size": 50,
              "max_planned_product_requests": 400,
              "delay_seconds": 1.5,
              "live_read_only": True,
              "same_browser_context": True,
              "max_city_control_reresolutions_per_attempt": 1,
              "commercial_retries_per_attempt": 0,
              "full_crawl": True,
              "google_sheets_writes": False,
              "commercial_persistence": False,
              "catalog_accepted": False,
              "production_authority": False,
              "extraction_enabled": False,
              "stop_conditions": [
                  "persistent_403",
                  "http_429",
                  "captcha",
                  "login_required",
                  "host_mismatch",
                  "city_selection_not_verified",
                  "brand_values_missing",
                  "brand_partition_exceeds_search_window",
                  "partition_frontier_below_root_total",
                  "partition_request_budget_exceeded",
                  "partition_total_mismatch",
                  "partial_or_unexpected_product_page",
                  "unique_product_coverage_mismatch",
                  "excessive_load_risk",
              ],
          }
          request = json.loads(
              Path(".automation/la-colonia-full-catalog-request.json").read_text(encoding="utf-8")
          )
          if request != expected:
              raise SystemExit("full_catalog_request_mismatch")

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          if event.get("ref") != "refs/heads/main":
              raise SystemExit("full_catalog_push_not_main")
          repository = event.get("repository") or {}
          if repository.get("full_name") != "Jchernand3z19/Portafolio":
              raise SystemExit("full_catalog_repository_mismatch")
          message = str((event.get("head_commit") or {}).get("message") or "")
          expected_prefix = (
              "Merge pull request #304 from "
              "Jchernand3z19/fix/precios-sps-decouple-radiography-attempt-7"
          )
          if not message.startswith(expected_prefix):
              raise SystemExit("full_catalog_merge_identity_mismatch")
          PY

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Obtener catalogo SPS completo
        id: catalog
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_sps_la_colonia_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --page-size 50 \
            --delay-seconds 1.5 \
            --output run-artifacts/full-catalog.json \
            --csv-output run-artifacts/full-catalog.csv
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar catalogo y diagnostico
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-sps-full-catalog-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Reflejar resultado real
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.catalog.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "El runner no produjo codigo de salida." >&2
            exit 1
          fi
          exit "$exit_code"
