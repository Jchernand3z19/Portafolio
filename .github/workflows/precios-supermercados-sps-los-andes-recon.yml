name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify SPS stores from public API
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          endpoint='https://andes.aveapplications.com/api/em/store/get_filter'

          # User authorization window: 2026-09-04T01:13:02Z through
          # 2026-09-05T01:13:02Z. Exactly one public read-only query POST.
          # This mirrors the public frontend store selector: no auth, cookies,
          # login, cart, checkout, mutations or retries; concurrency is 1.
          printf '%s' '{"business_partner":1,"cityCode":null,"pickPosition":"PD"}' > "$tmp/request.json"
          curl --compressed --fail --silent --show-error --location \
            --max-time 20 --retry 0 \
            -H 'Content-Type: application/json' \
            --data-binary @"$tmp/request.json" \
            "$endpoint" -o "$tmp/stores.json"

          python - "$tmp/stores.json" <<'PY'
          import json, sys
          from collections.abc import Mapping

          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          print('top_type=', type(payload).__name__)
          if isinstance(payload, Mapping):
              print('top_keys=', sorted(payload.keys()))

          def rows(value):
              if isinstance(value, list): return value
              if isinstance(value, dict):
                  for key in ('data','stores','items','result','results'):
                      v=value.get(key)
                      if isinstance(v,list): return v
                  for v in value.values():
                      if isinstance(v,list) and all(isinstance(x,dict) for x in v): return v
              return []

          items=rows(payload)
          print('store_count=', len(items))
          fields=('id','name','address','location_one_code','location_one_name','location_two_code','location_two_name','office_code','latitude','longitude','active')
          for item in items:
              blob=' '.join(str(item.get(k,'')) for k in ('name','address','location_one_name','location_two_name')).lower()
              if any(token in blob for token in ('san pedro sula','s.p.s',' sps','cortés','cortes')):
                  print('SPS_STORE=', json.dumps({k:item.get(k) for k in fields if k in item}, ensure_ascii=False, sort_keys=True))
          PY
