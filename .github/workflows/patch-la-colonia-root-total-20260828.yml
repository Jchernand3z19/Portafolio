name: Patch La Colonia root total 20260828

on:
  push:
    branches: [fix/la-colonia-root-total-recheck-20260828]
    paths:
      - precios-supermercados-sps/.automation/patch-root-total-20260828.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: precios-supermercados-sps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/la-colonia-root-total-recheck-20260828

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Aplicar parche mínimo y prueba focalizada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/obtener_catalogo_sps_la_colonia_operativo.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''\n\ndef _run_catalog(*, page_size: int, delay_seconds: float) -> dict[str, Any]:\n'''
          helper = '''\n\ndef _resolve_root_total_after_partitions(\n    *,\n    context: Any,\n    root_url: str,\n    initial_total: int,\n    unique_product_count: int,\n    diagnostic: dict[str, Any],\n) -> int:\n    \"\"\"Relee una sola vez el total raíz si el binding inicial quedó transitorio.\n\n    La relectura sólo puede corregir el total cuando las dos señales de partición\n    ya coinciden exactamente con las identidades únicas extraídas. Cualquier otra\n    discrepancia conserva el comportamiento fail-closed.\n    \"\"\"\n\n    if unique_product_count == initial_total:\n        return initial_total\n    if (\n        diagnostic[\"partition_quantity_estimate_sum\"] != unique_product_count\n        or diagnostic[\"partition_observed_total_sum\"] != unique_product_count\n    ):\n        raise full.FullCatalogError(\n            \"unique_product_coverage_mismatch\", diagnostic=diagnostic\n        )\n\n    _ensure_request_budget(diagnostic)\n    response = context.request.get(\n        root_url,\n        timeout=core.PRODUCT_REQUEST_TIMEOUT_MS,\n        fail_on_status_code=False,\n    )\n    payload = core._read_json_response(\n        response, diagnostic, kind=\"root_product_search_recheck\"\n    )\n    rechecked_total, _ = core._read_shape(payload)\n    diagnostic[\"product_requests_completed\"] += 1\n    if rechecked_total <= 0 or rechecked_total != unique_product_count:\n        raise full.FullCatalogError(\n            \"unique_product_coverage_mismatch\", diagnostic=diagnostic\n        )\n    diagnostic[\"catalog_products_reported\"] = rechecked_total\n    return rechecked_total\n'''
          if helper.strip() not in text:
              if anchor not in text:
                  raise SystemExit('run_catalog_anchor_missing')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''            if len(unique_products) != root_total:\n                raise full.FullCatalogError(\n                    \"unique_product_coverage_mismatch\", diagnostic=diagnostic\n                )\n\n            artifact = {\n'''
          new = '''            root_total = _resolve_root_total_after_partitions(\n                context=context,\n                root_url=root_url,\n                initial_total=root_total,\n                unique_product_count=len(unique_products),\n                diagnostic=diagnostic,\n            )\n\n            artifact = {\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('coverage_block_missing')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_la_colonia_root_total_recheck.py')
          test_path.write_text('''from __future__ import annotations\n\nimport pytest\n\nimport obtener_catalogo_sps_la_colonia_operativo as operational\n\n\nclass _Request:\n    def __init__(self, payload):\n        self.payload = payload\n        self.calls = 0\n\n    def get(self, *_args, **_kwargs):\n        self.calls += 1\n        return self.payload\n\n\nclass _Context:\n    def __init__(self, payload):\n        self.request = _Request(payload)\n\n\ndef _diagnostic(total: int) -> dict[str, int]:\n    return {\n        \"partition_quantity_estimate_sum\": total,\n        \"partition_observed_total_sum\": total,\n        \"product_requests_completed\": 10,\n        \"catalog_products_reported\": 0,\n    }\n\n\ndef _patch_shape(monkeypatch):\n    monkeypatch.setattr(\n        operational.core, \"_read_json_response\", lambda response, *_args, **_kwargs: response\n    )\n    monkeypatch.setattr(\n        operational.core, \"_read_shape\", lambda payload: (payload[\"total\"], 0)\n    )\n\n\ndef test_no_recheck_when_initial_total_matches(monkeypatch):\n    _patch_shape(monkeypatch)\n    context = _Context({\"total\": 999})\n    diagnostic = _diagnostic(9469)\n    result = operational._resolve_root_total_after_partitions(\n        context=context, root_url=\"root\", initial_total=9469,\n        unique_product_count=9469, diagnostic=diagnostic,\n    )\n    assert result == 9469\n    assert context.request.calls == 0\n\n\ndef test_single_recheck_accepts_only_exact_coherent_total(monkeypatch):\n    _patch_shape(monkeypatch)\n    context = _Context({\"total\": 9469})\n    diagnostic = _diagnostic(9469)\n    result = operational._resolve_root_total_after_partitions(\n        context=context, root_url=\"root\", initial_total=9493,\n        unique_product_count=9469, diagnostic=diagnostic,\n    )\n    assert result == 9469\n    assert context.request.calls == 1\n    assert diagnostic[\"product_requests_completed\"] == 11\n    assert diagnostic[\"catalog_products_reported\"] == 9469\n\n\ndef test_recheck_stays_fail_closed_when_root_still_disagrees(monkeypatch):\n    _patch_shape(monkeypatch)\n    context = _Context({\"total\": 9493})\n    diagnostic = _diagnostic(9469)\n    with pytest.raises(operational.full.FullCatalogError) as exc:\n        operational._resolve_root_total_after_partitions(\n            context=context, root_url=\"root\", initial_total=9493,\n            unique_product_count=9469, diagnostic=diagnostic,\n        )\n    assert exc.value.reason == \"unique_product_coverage_mismatch\"\n    assert context.request.calls == 1\n\n\ndef test_recheck_is_not_attempted_when_partition_signals_disagree(monkeypatch):\n    _patch_shape(monkeypatch)\n    context = _Context({\"total\": 9469})\n    diagnostic = _diagnostic(9469)\n    diagnostic[\"partition_observed_total_sum\"] = 9468\n    with pytest.raises(operational.full.FullCatalogError):\n        operational._resolve_root_total_after_partitions(\n            context=context, root_url=\"root\", initial_total=9493,\n            unique_product_count=9469, diagnostic=diagnostic,\n        )\n    assert context.request.calls == 0\n''', encoding='utf-8')
          PY
          python -m pip install -r requirements.txt >/dev/null
          python -m pytest -q tests/test_la_colonia_root_total_recheck.py

      - name: Commit parche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/obtener_catalogo_sps_la_colonia_operativo.py tests/test_la_colonia_root_total_recheck.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: reconcilia total raíz transitorio de La Colonia"
          git push origin HEAD:fix/la-colonia-root-total-recheck-20260828
