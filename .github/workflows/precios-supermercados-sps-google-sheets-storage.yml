name: Precios Supermercados SPS - Google Sheets storage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Acción sobre el Spreadsheet"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply-config

permissions:
  contents: read

concurrency:
  group: precios-sps-google-sheets-storage
  cancel-in-progress: false

jobs:
  storage:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && github.ref == 'refs/heads/main' && (inputs.mode == 'check' || inputs.mode == 'apply-config') }}
    runs-on: ubuntu-latest
    environment: precios-sps-storage

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Verificar o materializar configuración
        env:
          PRECIOS_SPS_GOOGLE_SPREADSHEET_ID: ${{ vars.PRECIOS_SPS_GOOGLE_SPREADSHEET_ID }}
          PRECIOS_SPS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PRECIOS_SPS_GOOGLE_SERVICE_ACCOUNT_JSON }}
          STORAGE_MODE: ${{ inputs.mode }}
        run: python precios-supermercados-sps/scripts/inicializar_google_sheets.py --mode "$STORAGE_MODE"
