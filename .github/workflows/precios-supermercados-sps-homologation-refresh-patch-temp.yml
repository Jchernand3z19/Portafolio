name: Precios SPS - aplica refresh homologación temporal

on:
  push:
    branches:
      - feature/product-homologation-daily-refresh
    paths:
      - ".github/workflows/precios-supermercados-sps-homologation-refresh-patch-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && contains(github.event.head_commit.message, 'ejecuta parche temporal de refresh') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Aplicar parche y retirar auxiliares temporales
        run: |
          python precios-supermercados-sps/scripts/optimizar_refresh_homologacion_temp.py
          rm precios-supermercados-sps/scripts/optimizar_refresh_homologacion_temp.py
          rm .github/workflows/precios-supermercados-sps-homologation-refresh-patch-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios-supermercados-sps/scripts/backfill_homologacion_turso.py \
                  .github/workflows/precios-supermercados-sps-la-colonia-mvp-update.yml \
                  precios-supermercados-sps/scripts/optimizar_refresh_homologacion_temp.py \
                  .github/workflows/precios-supermercados-sps-homologation-refresh-patch-temp.yml
          git diff --cached --check
          git commit -m "feat(precios): refresca homologación de forma diferencial"
          git push origin HEAD:feature/product-homologation-daily-refresh
