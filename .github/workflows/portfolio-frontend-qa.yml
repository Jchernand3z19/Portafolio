name: Portfolio - Frontend QA

on:
  pull_request:
    paths:
      - "index.html"
      - "script.js"
      - "css/**"
      - "js/**"
      - "**/portfolio/**"
      - "tests/portfolio_frontend_smoke.py"
      - ".github/workflows/portfolio-frontend-qa.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "script.js"
      - "css/**"
      - "js/**"
      - "**/portfolio/**"
      - "tests/portfolio_frontend_smoke.py"
      - ".github/workflows/portfolio-frontend-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Validar sintaxis JavaScript
        run: |
          node --check script.js
          node --check js/main.js
          node --check js/i18n.js
          node --check js/projects/registry.js
          find . -path '*/portfolio/*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar smoke bilingüe, responsive y accesible
        run: python tests/portfolio_frontend_smoke.py
