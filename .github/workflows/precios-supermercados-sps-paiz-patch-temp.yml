name: Precios SPS - Paiz parche temporal

on:
  push:
    branches: [feature/paiz-final-acquisition]
    paths:
      - precios-supermercados-sps/scripts/patch_workflow_paiz_temp.py
      - .github/workflows/precios-supermercados-sps-paiz-patch-temp.yml

permissions:
  contents: write

concurrency:
  group: precios-sps-paiz-patch-temp
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: precios-supermercados-sps
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Aplicar parche determinista corregido
        run: python scripts/patch_workflow_paiz_temp.py

      - name: Compilar integración Paiz
        run: |
          python -m py_compile scripts/migrar_mvp_paiz.py
          python -m py_compile scripts/actualizar_mvp_turso_paiz.py
          python -m py_compile scripts/obtener_catalogo_paiz_operativo.py
          python -m py_compile scripts/patch_workflow_paiz_temp.py

      - name: Retirar maquinaria temporal y publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../.github/workflows/precios-supermercados-sps-la-colonia-mvp-update.yml
          git rm scripts/patch_workflow_paiz_temp.py
          git rm ../.github/workflows/precios-supermercados-sps-paiz-patch-temp.yml
          git diff --cached --check
          git commit -m "ci(paiz): integra actualización diaria por sucursal"
          git push origin HEAD:feature/paiz-final-acquisition
