name: Precios Supermercados SPS - Pruebas base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Compilar src y scripts
        run: python -m compileall precios-supermercados-sps/src precios-supermercados-sps/scripts

      - name: Ejecutar suite completa
        run: pytest precios-supermercados-sps/tests

  audit-historical-branches:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/precios-sps-historical-branches' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Obtener todas las ramas remotas
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Clasificar ramas precios-sps
        shell: bash
        run: |
          set -euo pipefail
          python3 precios-supermercados-sps/scripts/auditar_ramas_historicas.py \
            --json-output "$RUNNER_TEMP/precios-sps-branch-audit.json" \
            --markdown-output "$RUNNER_TEMP/precios-sps-branch-audit.md"
          cat "$RUNNER_TEMP/precios-sps-branch-audit.md" >> "$GITHUB_STEP_SUMMARY"
