name: Precios Supermercados SPS - Pruebas base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Verificar consistencia de dependencias instaladas
        run: python -m pip check

      - name: Compilar src y scripts sin SyntaxWarning
        run: python -W error::SyntaxWarning -m compileall precios-supermercados-sps/src precios-supermercados-sps/scripts

      - name: Ejecutar suite completa
        run: pytest precios-supermercados-sps/tests

  homologation-audit-temp:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'Jchernand3z19/Portafolio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/product-homologation-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Auditar 56K productos en Turso con SELECT únicamente
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python precios-supermercados-sps/scripts/auditar_homologacion_turso_temp.py

      - name: Publicar evidencia temporal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: product-homologation-audit-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/homologation/
          if-no-files-found: error
          retention-days: 7
