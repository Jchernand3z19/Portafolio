name: La Colonia - Actualización MVP

on:
  schedule:
    - cron: "17 11 * * *" # 05:17 America/Tegucigalpa
  workflow_dispatch:
    inputs:
      live_read_only_authorized:
        description: Confirma autorización humana vigente para consultas públicas read-only del MVP
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: la-colonia-mvp-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'Jchernand3z19/Portafolio' && (github.event_name == 'schedule' || inputs.live_read_only_authorized == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Descargar catálogo SPS La Colonia
        id: sps
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_sps_la_colonia_operativo_v2.py \
            --live-read-only \
            --allow-full-catalog \
            --page-size 50 \
            --delay-seconds 1.5 \
            --output run-artifacts/sps/full-catalog.json \
            --csv-output run-artifacts/sps/full-catalog.csv
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogo TGU La Colonia
        id: tgu
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_tgu_la_colonia_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --page-size 50 \
            --delay-seconds 1.5 \
            --output run-artifacts/tgu/full-catalog.json \
            --csv-output run-artifacts/tgu/full-catalog.csv
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogo SPS Comisariato Los Andes
        id: los_andes
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_comisariato_los_andes_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 1.0 \
            --max-retries 0 \
            --output run-artifacts/los-andes/full-catalog.json \
            --raw-directory run-artifacts/los-andes/raw \
            --evidence-output run-artifacts/los-andes/evidence.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogos TGU Paiz
        id: paiz
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_paiz_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 1.0 \
            --max-requests 500 \
            --output-directory run-artifacts/paiz \
            --raw-directory run-artifacts/paiz/raw \
            --evidence-output run-artifacts/paiz/evidence.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogo SPS Colonial
        id: colonial
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_colonial_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --max-requests 450 \
            --deadline-seconds 1200 \
            --output run-artifacts/colonial
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogos Walmart
        id: walmart
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_walmart_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 1.0 \
            --max-requests 700 \
            --output-directory run-artifacts/walmart \
            --raw-directory run-artifacts/walmart/raw \
            --evidence-output run-artifacts/walmart/evidence.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Descargar catálogos PriceSmart
        id: pricesmart
        shell: bash
        run: |
          set +e
          python scripts/obtener_catalogo_pricesmart_operativo.py \
            --live-read-only \
            --allow-full-catalog \
            --delay-seconds 0.5 \
            --max-requests 80 \
            --output-directory run-artifacts/pricesmart \
            --raw-directory run-artifacts/pricesmart/raw \
            --evidence-output run-artifacts/pricesmart/evidence.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Aceptar sólo snapshots completos
        shell: bash
        env:
          SPS_EXIT: ${{ steps.sps.outputs.exit_code }}
          TGU_EXIT: ${{ steps.tgu.outputs.exit_code }}
          LOS_ANDES_EXIT: ${{ steps.los_andes.outputs.exit_code }}
          PAIZ_EXIT: ${{ steps.paiz.outputs.exit_code }}
          COLONIAL_EXIT: ${{ steps.colonial.outputs.exit_code }}
          WALMART_EXIT: ${{ steps.walmart.outputs.exit_code }}
          PRICESMART_EXIT: ${{ steps.pricesmart.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$SPS_EXIT" = "0"
          test "$TGU_EXIT" = "0"
          test "$LOS_ANDES_EXIT" = "0"
          test "$PAIZ_EXIT" = "0"
          test "$COLONIAL_EXIT" = "0"
          test "$WALMART_EXIT" = "0"
          test "$PRICESMART_EXIT" = "0"
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes
          from actualizar_mvp_turso_comisariato_los_andes import validate_snapshot_bytes as validate_los_andes
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes as validate_paiz

          for city in ('sps', 'tgu'):
              snapshot = validate_snapshot_bytes(Path(f'run-artifacts/{city}/full-catalog.json').read_bytes())
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True

          los_andes = validate_los_andes(Path('run-artifacts/los-andes/full-catalog.json').read_bytes())
          assert los_andes['catalog_complete'] is True
          assert los_andes['location_verified_same_run'] is True
          assert los_andes['catalog_products_reported'] == los_andes['unique_products_extracted']

          for name in ('multiplaza', 'proceres'):
              snapshot = validate_paiz(Path(f'run-artifacts/paiz/snapshot-paiz-{name}.json').read_bytes())
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True
              assert snapshot['catalog_products_reported'] == snapshot['unique_products_extracted']

          generic = (
              ('run-artifacts/colonial/full-catalog.json', 'colonial'),
              ('run-artifacts/walmart/snapshot-walmart-sps.json', 'walmart'),
              ('run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json', 'walmart'),
              ('run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json', 'walmart'),
              ('run-artifacts/pricesmart/snapshot-pricesmart-sps.json', 'pricesmart'),
              ('run-artifacts/pricesmart/snapshot-pricesmart-tgu.json', 'pricesmart'),
          )
          for path, supermarket in generic:
              snapshot = validate_snapshot_bytes(Path(path).read_bytes(), supermarket_id=supermarket)
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True
              assert snapshot['catalog_products_reported'] == snapshot['unique_products_extracted']
          PY

      - name: Persistir La Colonia, Los Andes, Colonial, Walmart y PriceSmart
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          persist_generic() {
            local file="$1"
            local supermarket="$2"
            local suffix="$3"
            python scripts/actualizar_mvp_turso_la_colonia.py \
              "$file" \
              --supermarket "$supermarket" \
              --run-id "${GITHUB_RUN_ID}-${suffix}"
          }

          persist_generic run-artifacts/sps/full-catalog.json la_colonia sps
          persist_generic run-artifacts/tgu/full-catalog.json la_colonia tgu

          python scripts/actualizar_mvp_turso_comisariato_los_andes.py \
            run-artifacts/los-andes/full-catalog.json \
            --run-id "${GITHUB_RUN_ID}-los-andes"

          persist_generic run-artifacts/colonial/full-catalog.json colonial colonial
          persist_generic run-artifacts/walmart/snapshot-walmart-sps.json walmart walmart-sps
          persist_generic run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json walmart walmart-tgu-ffaa
          persist_generic run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json walmart walmart-tgu-el-sauce
          persist_generic run-artifacts/pricesmart/snapshot-pricesmart-sps.json pricesmart pricesmart-sps
          persist_generic run-artifacts/pricesmart/snapshot-pricesmart-tgu.json pricesmart pricesmart-tgu

      - name: Asegurar esquema Paiz en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/migrar_mvp_paiz.py --turso

      - name: Persistir Paiz
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz/snapshot-paiz-multiplaza.json \
            --run-id "${GITHUB_RUN_ID}-paiz-multiplaza" \
            --verify
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz/snapshot-paiz-proceres.json \
            --run-id "${GITHUB_RUN_ID}-paiz-proceres" \
            --verify

      - name: Verificar commits e integridad en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes
          from actualizar_mvp_turso_comisariato_los_andes import validate_snapshot_bytes as validate_los_andes
          from actualizar_mvp_turso_la_colonia import _execute_rows, _pipeline, _stmt
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes as validate_paiz

          run_id = os.environ['GITHUB_RUN_ID']
          expected_runs = []
          expected_current = {}

          def add(path, supermarket, suffix, validator):
              raw = Path(path).read_bytes()
              snapshot = validator(raw)
              expected_runs.append([
                  f'{run_id}-{suffix}',
                  supermarket,
                  snapshot['location_id'],
                  'success',
                  snapshot['skus_extracted'],
                  snapshot['catalog_products_reported'],
                  hashlib.sha256(raw).hexdigest(),
              ])
              expected_current[(supermarket, snapshot['location_id'])] = snapshot['skus_extracted']

          add('run-artifacts/sps/full-catalog.json', 'la_colonia', 'sps', validate_snapshot_bytes)
          add('run-artifacts/tgu/full-catalog.json', 'la_colonia', 'tgu', validate_snapshot_bytes)
          add('run-artifacts/los-andes/full-catalog.json', 'comisariato_los_andes', 'los-andes', validate_los_andes)
          add('run-artifacts/paiz/snapshot-paiz-multiplaza.json', 'paiz', 'paiz-multiplaza', validate_paiz)
          add('run-artifacts/paiz/snapshot-paiz-proceres.json', 'paiz', 'paiz-proceres', validate_paiz)
          add('run-artifacts/colonial/full-catalog.json', 'colonial', 'colonial', lambda raw: validate_snapshot_bytes(raw, supermarket_id='colonial'))
          add('run-artifacts/walmart/snapshot-walmart-sps.json', 'walmart', 'walmart-sps', lambda raw: validate_snapshot_bytes(raw, supermarket_id='walmart'))
          add('run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json', 'walmart', 'walmart-tgu-ffaa', lambda raw: validate_snapshot_bytes(raw, supermarket_id='walmart'))
          add('run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json', 'walmart', 'walmart-tgu-el-sauce', lambda raw: validate_snapshot_bytes(raw, supermarket_id='walmart'))
          add('run-artifacts/pricesmart/snapshot-pricesmart-sps.json', 'pricesmart', 'pricesmart-sps', lambda raw: validate_snapshot_bytes(raw, supermarket_id='pricesmart'))
          add('run-artifacts/pricesmart/snapshot-pricesmart-tgu.json', 'pricesmart', 'pricesmart-tgu', lambda raw: validate_snapshot_bytes(raw, supermarket_id='pricesmart'))
          expected_runs.sort()

          run_ids = [row[0] for row in expected_runs]
          placeholders = ','.join('?' for _ in run_ids)
          run_sql = f'''SELECT scrape_run_id,supermarket_id,location_id,run_status,sku_count,catalog_product_count,source_json_sha256 FROM scrape_runs WHERE scrape_run_id IN ({placeholders}) ORDER BY scrape_run_id'''
          runs = []
          for attempt in range(7):
              data = _pipeline(
                  os.environ['TURSO_DATABASE_URL'],
                  os.environ['TURSO_AUTH_TOKEN'],
                  [{'type':'execute','stmt':_stmt(run_sql, tuple(run_ids))}, {'type':'close'}],
              )
              runs = _execute_rows(data['results'][0])
              if runs == expected_runs:
                  break
              if attempt < 6:
                  time.sleep(20)
          if runs != expected_runs:
              raise SystemExit(f'commit_not_confirmed:expected={expected_runs}:actual={runs}')

          pairs = sorted(expected_current)
          scope_sql = ' OR '.join('(supermarket_id=? AND location_id=?)' for _ in pairs)
          scope_args = tuple(value for pair in pairs for value in pair)
          data = _pipeline(
              os.environ['TURSO_DATABASE_URL'],
              os.environ['TURSO_AUTH_TOKEN'],
              [
                  {'type':'execute','stmt':_stmt(f'''SELECT supermarket_id,location_id,COUNT(*) FROM price_history WHERE valid_to_utc IS NULL AND ({scope_sql}) GROUP BY supermarket_id,location_id ORDER BY supermarket_id,location_id''', scope_args)},
                  {'type':'execute','stmt':_stmt(f'''SELECT COUNT(*) FROM (SELECT supermarket_id,product_id,location_id FROM price_history WHERE valid_to_utc IS NULL AND ({scope_sql}) GROUP BY supermarket_id,product_id,location_id HAVING COUNT(*)>1)''', scope_args)},
                  {'type':'execute','stmt':_stmt('SELECT COUNT(*) FROM pragma_foreign_key_check')},
                  {'type':'execute','stmt':_stmt('PRAGMA integrity_check')},
                  {'type':'close'},
              ],
          )
          current_rows = _execute_rows(data['results'][0])
          duplicates = _execute_rows(data['results'][1])
          foreign_keys = _execute_rows(data['results'][2])
          integrity = _execute_rows(data['results'][3])
          actual_current = {(row[0], row[1]): row[2] for row in current_rows}
          if set(actual_current) != set(expected_current):
              raise SystemExit(f'current_scope_missing:expected={sorted(expected_current)}:actual={sorted(actual_current)}')
          incomplete = {
              f'{key[0]}:{key[1]}': (expected_current[key], actual_current[key])
              for key in expected_current
              if actual_current[key] < expected_current[key]
          }
          if incomplete:
              raise SystemExit(f'current_state_incomplete:{incomplete}')
          if duplicates != [[0]] or foreign_keys != [[0]] or integrity != [['ok']]:
              raise SystemExit(f'integrity_failed:{duplicates}:{foreign_keys}:{integrity}')
          print(json.dumps({
              'runs': runs,
              'current_open_by_location': current_rows,
              'duplicate_open_periods': 0,
              'foreign_key_violations': 0,
              'integrity_check': 'ok',
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: supermercados-mvp-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14
