name: Precios SPS - Los Andes public recon

on:
  pull_request:
    paths:
      - '.github/workflows/precios-supermercados-sps-los-andes-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect catalog and location frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base='https://comisariatolosandes.com'

          # User authorization window: 2026-09-04T01:13:02Z through
          # 2026-09-05T01:13:02Z. Exactly six public GETs, concurrency 1,
          # no retries, cookies, login, age-gate action, cart or mutations.
          files=(
            main-QMN3KKEM.js
            chunk-XN3CPJKT.js
            chunk-WBUEVQKI.js
            chunk-GQU2NDPB.js
            chunk-MVSEO36R.js
            chunk-KPFBBVRC.js
          )
          for f in "${files[@]}"; do
            curl --compressed --fail --silent --show-error --location \
              --max-time 20 --retry 0 "$base/$f" -o "$tmp/$f"
            printf '%s bytes=%s sha256=%s\n' "$f" "$(wc -c < "$tmp/$f")" "$(sha256sum "$tmp/$f" | awk '{print $1}')"
            sleep 0.4
          done

          python - "$tmp" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          texts = {p.name: p.read_text(encoding='utf-8', errors='replace') for p in root.glob('*.js')}

          def show_hits(label, pattern, radius=1200, limit=25):
              print(f'=== {label} ===')
              count = 0
              seen = set()
              for name, text in texts.items():
                  for m in re.finditer(pattern, text, re.I):
                      s=max(0,m.start()-radius); e=min(len(text),m.end()+radius)
                      sn=text[s:e].replace('\n',' ')
                      key=(name,sn[:300])
                      if key in seen: continue
                      seen.add(key)
                      print(f'FILE={name}\n{sn}\n---')
                      count += 1
                      if count >= limit: return

          show_hits('service symbol Fr', r'\bFr\b', 1800, 8)
          show_hits('location symbol ji', r'\bji\b', 1800, 8)
          show_hits('product methods', r'getProducts(?:Search|ByCode|ById)?\s*\(', 1600, 20)
          show_hits('category methods', r'(?:get|load)[A-Za-z0-9_]*Categor[A-Za-z0-9_]*\s*\(', 1400, 20)
          show_hits('store/location methods', r'(?:get|load|set)[A-Za-z0-9_]*(?:Store|Location|City|Cities|Agency|Agencies)[A-Za-z0-9_]*\s*\(', 1600, 30)
          show_hits('http paths', r'["\'][^"\']{0,120}(?:product|producto|material|category|categoria|store|location|city|agency|agencia|api)[^"\']{0,160}["\']', 300, 80)
          show_hits('config objects', r'(?:url_amazon_s3|providerId|defaultDeliveryType|apiUrl|baseUrl|url_api|api_url|office_code)', 1400, 30)

          print('=== all URL-like strings ===')
          vals=set()
          for name,text in texts.items():
              for u in re.findall(r'https?://[^"\'`\\\s<>]+', text): vals.add(u.rstrip('),;'))
              for s in re.findall(r'["\'](/[^"\']{2,180})["\']', text):
                  if re.search(r'api|product|producto|material|category|categoria|store|location|city|agency|agencia', s, re.I): vals.add(s)
          for v in sorted(vals): print(v)
          PY
