name: Precios Supermercados SPS - Pruebas base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Verificar consistencia de dependencias instaladas
        run: python -m pip check

      - name: Compilar src y scripts
        run: python -m compileall precios-supermercados-sps/src precios-supermercados-sps/scripts

      - name: Ejecutar suite completa
        run: pytest precios-supermercados-sps/tests
