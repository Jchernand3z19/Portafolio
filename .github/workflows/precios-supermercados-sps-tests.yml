name: Precios Supermercados SPS - Pruebas base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/precios-supermercados-sps-tests.yml"
      - ".github/workflows/precios-supermercados-sps-la-colonia-command.yml"
      - ".github/workflows/precios-supermercados-sps-la-colonia-diagnostic.yml"
      - ".github/workflows/precios-supermercados-sps-la-colonia-dispatch-recovery.yml"
      - ".github/workflows/precios-supermercados-sps-la-colonia-facet-discovery.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Compilar src y scripts
        run: python -m compileall precios-supermercados-sps/src precios-supermercados-sps/scripts

      - name: Ejecutar suite completa
        run: pytest precios-supermercados-sps/tests
